<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Cybersecurity — Course Portal</title>
<style>
  :root{
    --bg:#ffe8d6;
    --panel:#f5decc;
    --panel-raised:#ebd0bc;
    --line:#b7b7a4;
    --text:#2e3027;
    --text-dim:#6b705c;
    --accent:#b35e38;
    --accent-dim:#a5a58d;
  }
  :root[data-theme="dark"]{
    --bg:#1c1e19;
    --panel:#272a23;
    --panel-raised:#33372e;
    --line:#6b705c;
    --text:#ffe8d6;
    --text-dim:#b7b7a4;
    --accent:#ddbea9;
    --accent-dim:#cb997e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif}
  body{overflow:hidden}
  .portal-bar{height:64px;display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:10}
  .brand{font-family:"SFMono-Regular","Consolas",monospace;font-size:12px;color:var(--text-dim);margin-right:8px;white-space:nowrap}
  .brand b{color:var(--accent)}
  .units{display:flex;gap:6px;flex:1}
  .unit-btn,.theme-btn{border:1px solid var(--line);background:var(--panel);color:var(--text-dim);border-radius:7px;padding:9px 13px;cursor:pointer;font:600 12px "SFMono-Regular","Consolas",monospace;transition:.15s}
  .unit-btn:hover,.theme-btn:hover{border-color:var(--accent);color:var(--text)}
  .unit-btn.active{border-color:var(--accent);background:var(--panel-raised);color:var(--accent)}
  .theme-btn{white-space:nowrap}
  .viewer{width:100%;height:calc(100vh - 64px);border:0;display:block;background:var(--bg)}
  @media(max-width:760px){
    .portal-bar{height:auto;min-height:64px;flex-wrap:wrap}
    .brand{width:100%}
    .units{overflow-x:auto}
    .viewer{height:calc(100vh - 108px)}
  }
</style>
</head>
<body>
<nav class="portal-bar" aria-label="AP Cybersecurity units">
  <div class="brand"><b>AP-CYBERSECURITY</b> / COURSE</div>
  <div class="units">
    <button class="unit-btn active" data-unit="1">Unit 1</button>
    <button class="unit-btn" data-unit="2">Unit 2</button>
    <button class="unit-btn" data-unit="3">Unit 3</button>
    <button class="unit-btn" data-unit="4">Unit 4</button>
    <button class="unit-btn" data-unit="5">Unit 5</button>
  </div>
  <button class="theme-btn" id="themeToggle" type="button">🌙 Dark Mode</button>
</nav>

<iframe id="unitFrame" class="viewer" title="AP Cybersecurity unit content" src="ap-cybersecurity-unit1.html"></iframe>

<script>
const frame = document.getElementById("unitFrame");
const themeToggle = document.getElementById("themeToggle");
const unitButtons = [...document.querySelectorAll(".unit-btn")];
const unitFiles = {
  1: "ap-cybersecurity-unit1.html",
  2: "ap-cybersecurity-unit2.html",
  3: "ap-cybersecurity-unit3.html",
  4: "ap-cybersecurity-unit4.html",
  5: "ap-cybersecurity-unit5.html"
};

let currentTheme = localStorage.getItem("ap-cybersecurity-theme") || "light";
let currentUnit = 1;

function applyPortalTheme(theme){
  currentTheme = theme === "dark" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", currentTheme);
  localStorage.setItem("ap-cybersecurity-theme", currentTheme);
  themeToggle.textContent = currentTheme === "dark" ? "☀️ Light Mode" : "🌙 Dark Mode";
  propagateTheme();
}

function propagateTheme(){
  try{
    frame.contentDocument.documentElement.setAttribute("data-theme", currentTheme);
  }catch(e){}
  try{
    frame.contentWindow.postMessage({type:"ap-cybersecurity-theme",theme:currentTheme}, "*");
  }catch(e){}
}

function loadUnit(unit){
  currentUnit = Number(unit);
  unitButtons.forEach(btn => btn.classList.toggle("active", Number(btn.dataset.unit) === currentUnit));
  frame.src = unitFiles[currentUnit];
}

unitButtons.forEach(btn => btn.addEventListener("click", () => loadUnit(btn.dataset.unit)));
themeToggle.addEventListener("click", () => applyPortalTheme(currentTheme === "dark" ? "light" : "dark"));
frame.addEventListener("load", propagateTheme);
window.addEventListener("message", event => {
  if(event.data && event.data.type === "ap-cybersecurity-theme-request") propagateTheme();
});

applyPortalTheme(currentTheme);
</script>
</body>
</html>
