ces attack the same target simultaneously, it's called a <b>distributed denial of service (DDoS)</b> attack.</p>\n      <div class=\"callout\"><b>Trace the logic:</b> a smurf attack is clever because the adversary never sends traffic directly to the victim \u2014 it tricks an entire network's worth of devices into flooding the victim on the adversary's behalf, which also makes tracing the true source harder.</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>How adversaries exploit network vulnerabilities more broadly <span class=\"ekid\">3.1.B.1\u2013B.7</span></h3>\n      <ul>\n        <li>Sending malicious traffic to flood a network (DoS), map its internal structure, or spoof a legitimate device \u2014 networks with no firewall, or a misconfigured one, are vulnerable.</li>\n        <li>An adversary who has compromised one device often tries to leverage that access to compromise other devices on the same LAN (lateral movement, revisited from Unit 2's attack phases).</li>\n        <li>Adversaries who physically plug into a data port can access the LAN through the switch port <i>unless port security is enabled</i> \u2014 enabling DoS, MAC flooding, or MAC spoofing.</li>\n        <li>Adversaries outside physically secure spaces can pick up signals/beacon frames from a WAP broadcasting beyond the physical space \u2014 enabling eavesdropping and cryptographic attacks (connects back to Unit 1's war driving).</li>\n        <li>Networks that don't authenticate devices/users make it easier for adversaries to simply join and attack from within.</li>\n        <li><b>Rogue access point</b> \u2014 if there's an open network port, an adversary can plug in a wireless access point, creating a rogue AP they can use to access the internal network wirelessly (possibly from outside the building) \u2014 this bypasses any firewalls entirely, since it's direct LAN access.</li>\n        <li>Adversaries can attempt to break wireless encryption to intercept, steal, or compromise data on a network.</li>\n      </ul>\n    </div>\n\n    <div class=\"card\">\n      <h3>Assessing and documenting network risk \u2014 three tiers again <span class=\"ekid\">3.1.C.1\u2013C.6</span></h3>\n      <p>Network vulnerabilities can constitute risk to confidentiality, integrity, <i>and</i> availability at once \u2014 letting adversaries intercept/alter data in transit, launch DoS attacks, or move laterally to more sensitive systems. Automated vulnerability scanners can check networks/devices/applications for known vulnerabilities and produce a report with severity and mitigation recommendations. Exploiting a network vulnerability often requires advanced technical skill, which affects likelihood.</p>\n\n      <p><span class=\"risk-badge high\">HIGH</span> lets an adversary easily have significant impact \u2014 capturing traffic, spoofing a device, or launching a DoS.</p>\n      <div class=\"example\"><b>Illustrative example:</b> A single unsegmented internal network, accessible via wireless with weak encryption, hosting a server running the org's proprietary web application.</div>\n\n      <p><span class=\"risk-badge mod\">MODERATE</span> could give adversaries the ability to gain information about systems/devices on the network.</p>\n      <div class=\"example\"><b>Illustrative example:</b> An external firewall not configured to block external ICMP traffic.</div>\n\n      <p><span class=\"risk-badge low\">LOW</span> would be difficult to exploit and would likely have minimal negative impact.</p>\n      <div class=\"example\"><b>Illustrative example:</b> Wireless access points that broadcast a beacon frame containing the SSID and wireless encryption protocol.</div>\n    </div>\n\n    <div class=\"section-label\">Attack recognition matrix</div>\n    <div class=\"card\">\n      <h3>Distinguish the four named network attacks by what they manipulate</h3>\n      <table class=\"compare-table\">\n        <tr><th>Attack</th><th>What is manipulated</th><th>Primary effect</th><th>Best clue</th></tr>\n        <tr><td class=\"label\">ARP poisoning</td><td>IP \u2192 MAC mappings</td><td>Traffic interception / on-path attack</td><td>One IP appears associated with a different or conflicting MAC address.</td></tr>\n        <tr><td class=\"label\">MAC flooding</td><td>Switch MAC-address table</td><td>Traffic exposure through flooding</td><td>Sudden surge of frames with many different source MAC addresses.</td></tr>\n        <tr><td class=\"label\">DNS poisoning</td><td>DNS records / name resolution</td><td>Redirects users to a malicious destination</td><td>Unexpected DNS result or unexplained traffic change; inspect DNS records.</td></tr>\n        <tr><td class=\"label\">Smurf</td><td>ICMP + broadcast behavior</td><td>Denial of service</td><td>Large increase in ICMP requests sent to a broadcast address.</td></tr>\n      </table>\n      <p class=\"matrix-note\"><b>Fast distinction:</b> ARP answers \u201cwhich MAC address owns this local IP?\u201d DNS answers \u201cwhich IP address belongs to this domain name?\u201d MAC flooding attacks the switch's learned address table. Smurf attacks availability by causing many hosts to generate replies toward a victim.</p>\n    </div>\n\n    <div class=\"card\">\n      <h3>How a network vulnerability becomes an attack</h3>\n      <div class=\"flow\"><b>Open / weak control</b> \u2192 adversary gains a path \u2192 <b>access or traffic manipulation</b> \u2192 adversary reaches a goal</div>\n      <ul>\n        <li><b>No firewall / bad firewall rules</b> \u2192 malicious traffic can enter, scan, spoof, or flood the network.</li>\n        <li><b>Compromised LAN device</b> \u2192 adversary can attempt lateral movement to other devices.</li>\n        <li><b>Unsecured physical switch port</b> \u2192 adversary can connect directly to the LAN and launch attacks from inside.</li>\n        <li><b>Wireless signal extending outside the secure area</b> \u2192 an outside adversary can discover the network and attempt eavesdropping or cryptographic attacks.</li>\n        <li><b>No device/user authentication</b> \u2192 adversary may be able to join the network and attack from inside.</li>\n        <li><b>Open network port + no port security</b> \u2192 rogue access point can provide wireless access directly to the internal LAN, bypassing perimeter firewalls.</li>\n        <li><b>Weak wireless encryption</b> \u2192 intercepted wireless frames may be readable or vulnerable to cryptographic attacks.</li>\n      </ul>\n    </div>\n\n    <div class=\"card\">\n      <h3>Risk assessment: what makes a network vulnerability high, moderate, or low?</h3>\n      <p>The AP framework evaluates network risk using both <b>impact</b> and <b>difficulty/likelihood of exploitation</b>. A vulnerability is not automatically high risk just because it exists.</p>\n      <table class=\"compare-table\">\n        <tr><th>Risk</th><th>Reasoning</th></tr>\n        <tr><td class=\"label\">High</td><td>An adversary can relatively easily create a significant impact, such as capturing traffic, spoofing a legitimate device, or launching a DoS attack.</td></tr>\n        <tr><td class=\"label\">Moderate</td><td>The vulnerability mainly provides useful information about systems/devices or otherwise creates a more limited opportunity.</td></tr>\n        <tr><td class=\"label\">Low</td><td>Exploitation is difficult and the likely negative impact is minimal.</td></tr>\n      </table>\n      <p><b>Important:</b> automated vulnerability scanners can identify known vulnerabilities, their severity, and possible mitigations, but a scanner report does not replace contextual risk analysis. You still have to consider what the vulnerable system is connected to and what an adversary could accomplish.</p>\n    </div>\n\n    <div class=\"section-label\">What each wireless control actually changes</div>\n    <div class=\"card\">\n      <table class=\"compare-table\">\n        <tr><th>Control</th><th>Changes</th><th>Security purpose</th></tr>\n        <tr><td class=\"label\">Disable beacons</td><td>Whether the WAP openly advertises the network's presence</td><td>Makes discovery harder; does not encrypt traffic or authenticate users.</td></tr>\n        <tr><td class=\"label\">Limit signal direction/strength</td><td>Where the wireless signal can be received</td><td>Reduces exposure outside the intended physical space.</td></tr>\n        <tr><td class=\"label\">Strong encryption</td><td>Whether intercepted wireless frames can be read</td><td>Protects confidentiality of wireless traffic.</td></tr>\n        <tr><td class=\"label\">MAC filtering</td><td>Which device MAC addresses may access the network</td><td>Restricts unauthorized devices; the framework treats it as an access-control measure.</td></tr>\n        <tr><td class=\"label\">EAP + auth server</td><td>How wireless users/devices authenticate</td><td>Requires authentication before joining the organization's wireless network.</td></tr>\n      </table>\n      <div class=\"callout\"><b>Do not treat these controls as interchangeable.</b> Hiding an SSID does not encrypt traffic. Encryption does not stop a user from connecting to a rogue AP. Signal containment does not authenticate users. Strong network security normally combines multiple controls.</div>\n    </div>\n\n    <div class=\"section-label\">DMZ vs. subnet vs. VLAN</div>\n    <div class=\"card\">\n      <table class=\"compare-table\">\n        <tr><th>Technique</th><th>Primary idea</th><th>Why it improves security</th></tr>\n        <tr><td class=\"label\">DMZ / screened subnet</td><td>Places public-facing resources in a lower-security zone between external and internal networks.</td><td>Separates internet-facing systems from the internal LAN so compromise of a public server does not directly expose the internal network.</td></tr>\n        <tr><td class=\"label\">Subnetting</td><td>Divides an IP network into smaller IP-based networks.</td><td>Contains traffic and limits how many devices are exposed if one subnet is compromised.</td></tr>\n        <tr><td class=\"label\">VLAN</td><td>Uses switches to logically separate devices sharing physical switch infrastructure.</td><td>Creates logical security zones without requiring separate physical switching infrastructure.</td></tr>\n      </table>\n      <p class=\"matrix-note\"><b>Core idea:</b> segmentation does not magically stop an attack. Its main security value is <b>containment</b>: an adversary who compromises one segment should have a harder time reaching devices and data in other segments.</p>\n    </div>\n\n    <div class=\"section-label\">How to read an ACL on the AP exam</div>\n    <div class=\"card\">\n      <div class=\"flow\"><b>1.</b> Identify the packet's direction \u2192 <b>2.</b> identify protocol \u2192 <b>3.</b> identify source/destination IP \u2192 <b>4.</b> identify port/service \u2192 <b>5.</b> scan rules from top to bottom \u2192 <b>6.</b> stop at the first rule that matches \u2192 <b>7.</b> apply its ALLOW or DENY action</div>\n      <p style=\"margin-top:11px\">A rule only matters if the traffic matches <i>all relevant criteria in that rule</i>. A rule that says \u201cDENY TCP port 443 from 192.168.0.0\u2013192.168.255.255\u201d does not deny ICMP, TCP port 80, or TCP port 443 from an address outside that range.</p>\n      <div class=\"callout\"><b>Rule-order principle:</b> put the intended exceptions and more specific priorities in an order that produces the required result. A broad rule placed too early can make a later rule unreachable. The AP framework explicitly tests whether changing rule order changes which traffic is allowed or denied.</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>Firewall type vs. ACL logic</h3>\n      <p>Do not confuse <b>what kind of firewall</b> you have with <b>what rules the firewall applies</b>. Stateless/stateful/NGFW describes the firewall's filtering capabilities. An ACL describes the ordered allow/deny policy applied to traffic.</p>\n      <table class=\"compare-table\">\n        <tr><th>Question</th><th>What you are identifying</th></tr>\n        <tr><td class=\"label\">\u201cDoes it remember connection state?\u201d</td><td>Stateful vs. stateless</td></tr>\n        <tr><td class=\"label\">\u201cDoes it inspect applications/deep content or provide advanced prevention?\u201d</td><td>NGFW capabilities</td></tr>\n        <tr><td class=\"label\">\u201cWhich traffic is allowed or denied?\u201d</td><td>ACL rules</td></tr>\n        <tr><td class=\"label\">\u201cWhy was this connection denied?\u201d</td><td>Find the first matching ACL rule</td></tr>\n      </table>\n    </div>\n\n    <div class=\"section-label\">Must-know terms</div>\n    <div class=\"card\">\n      <div class=\"glossary\">\n        <div class=\"gterm\"><b>ARP \u2014</b> <span class=\"def\">address resolution protocol; maps IP addresses to MAC addresses at the default gateway.</span></div>\n        <div class=\"gterm\"><b>On-path / man-in-the-middle attack \u2014</b> <span class=\"def\">an adversary secretly intercepts and can alter communication between two parties who believe they're talking directly to each other.</span></div>\n        <div class=\"gterm\"><b>MAC spoofing \u2014</b> <span class=\"def\">faking a device's MAC address to impersonate another device on the network.</span></div>\n        <div class=\"gterm\"><b>Eavesdropping / sniffing \u2014</b> <span class=\"def\">capturing data in transit to record and copy it.</span></div>\n        <div class=\"gterm\"><b>Credential harvesting \u2014</b> <span class=\"def\">using a fake login page that looks legitimate to capture real credentials users enter.</span></div>\n        <div class=\"gterm\"><b>DoS / DDoS \u2014</b> <span class=\"def\">denial of service (one source) / distributed denial of service (many sources) \u2014 making a resource unavailable to legitimate users.</span></div>\n        <div class=\"gterm\"><b>Rogue access point \u2014</b> <span class=\"def\">an unauthorized WAP plugged into the internal network, giving an adversary direct wireless access to the LAN, bypassing firewalls.</span></div>\n      </div>\n    </div>\n\n    <div class=\"example walkthrough\">\n      <b class=\"step\">Worked example (matches sample MCQ 14 style \u2014 reading an ARP log):</b><br><br>\n      <div class=\"code\">2025-09-25 08:01:14 ARP Reply: 192.168.1.13 is-at 00:01:5e:00:fc:16\n2025-09-25 09:14:15 ARP Reply: 192.168.1.13 is-at 00:3b:cc:5e:ee:01</div>\n      Two different MAC addresses claim to own the <i>same</i> IP address within about an hour of each other. This duplicate/conflicting IP-to-MAC mapping is the signature of <b>ARP poisoning</b> \u2014 a legitimate device shouldn't suddenly change its physical (MAC) address. Detection: monitor for unusual ARP messages, especially duplicate MAC-address ARP packets, and check the ARP table on the default gateway.\n    </div>\n  ", "glossary": []}, {"id": "3.2", "title": "Protecting Networks: Managerial Controls and Wireless Security", "lo": "3.2.A Identify managerial controls related to network security &middot; 3.2.B Configure wireless network security features", "quiz": [{"q": "A wireless network is configured to use WPS for encryption. What is the primary security concern with this choice?", "opts": ["WPS requires too much processing power for most routers", "WPS has known vulnerabilities and is considered insecure", "WPS cannot be used with MAC filtering", "WPS only works with wired connections"], "correct": 1, "explain": "The framework explicitly lists WEP, WPS, and original WPA as having known vulnerabilities and being insecure \u2014 WPA3 is the recommended current standard."}, {"q": "A VPN policy explicitly prohibits split tunneling. What risk does this prohibition address?", "opts": ["The risk of an employee's device losing internet connectivity entirely", "The risk that some of a user's traffic bypasses the VPN's protections by routing directly to the internet", "The risk of using more than one VPN provider simultaneously", "The risk of an employee using a personal device instead of a company device"], "correct": 1, "explain": "Split (dual) tunneling means part of the user's traffic goes through the VPN and part goes directly to the internet unprotected \u2014 prohibiting it ensures all traffic gets the VPN's protections."}, {"q": "A switch security policy requires port security to be enabled on all switches. Which network attack from Topic 3.1 does this most directly help prevent?", "opts": ["DNS poisoning", "MAC flooding and unauthorized device access via open ports", "Smurf attacks", "Credential harvesting"], "correct": 1, "explain": "Port security limits what/how many devices can connect via a switch port, directly closing the vulnerability that allows MAC flooding and rogue device/access point connections through unsecured open ports."}], "html": "\n    <div class=\"section-label\">Core content</div>\n\n    <div class=\"card\">\n      <h3>Four network-related managerial policies <span class=\"ekid\">3.2.A.1\u2013A.4</span></h3>\n      <table class=\"compare-table\">\n        <tr><th>Policy</th><th>What it sets minimum standards for</th></tr>\n        <tr>\n          <td class=\"label\">Router security policy</td>\n          <td>Banning local user accounts (logins must use an approved auth server); disabling unnecessary services (e.g., Telnet); requiring a firewall (possibly a separate device from the router).</td>\n        </tr>\n        <tr>\n          <td class=\"label\">Switch security policy</td>\n          <td>Banning local user accounts; requiring port security to be enabled; using MAC filtering.</td>\n        </tr>\n        <tr>\n          <td class=\"label\">VPN policy</td>\n          <td>Which roles may use a VPN to access the internal network; authentication requirements (e.g., public/private key or MFA); a prohibition against <b>split tunneling</b> (also called dual tunneling).</td>\n        </tr>\n        <tr>\n          <td class=\"label\">Wireless security policy</td>\n          <td>Requiring authentication via an extensible authentication protocol (EAP) connected to an approved auth server; requiring all wireless traffic encrypted with AES at a minimum key length; disabling beacon frames on WAPs.</td>\n        </tr>\n      </table>\n    </div>\n\n    <div class=\"card\">\n      <h3>Configuring wireless security in practice <span class=\"ekid\">3.2.B.1\u2013B.4</span></h3>\n      <ul>\n        <li><b>Disable beacon frame broadcasting</b> \u2014 makes it harder for adversaries to find the network and learn its basic properties (this directly counters war driving from Unit 1).</li>\n        <li><b>Control broadcast direction and signal strength</b> \u2014 so the signal doesn't extend beyond the intended physical space (this directly closes the \"signal leaks outside the building\" vulnerability from 3.1.B).</li>\n        <li><b>Enable strong wireless encryption:</b>\n          <ul>\n            <li>WEP, WPS, and original WPA have <b>known vulnerabilities and are insecure</b> \u2014 flag these as red flags on the exam.</li>\n            <li><b>WPA3 is currently the strongest</b> wireless encryption algorithm.</li>\n          </ul>\n        </li>\n        <li><b>Enable MAC filtering</b> \u2014 prevents unauthorized devices from joining, and can require users to authenticate when joining.</li>\n      </ul>\n      <div class=\"callout\"><b>Exam trap:</b> if a scenario mentions WEP, WPS, or plain WPA (not WPA2/WPA3) in use, that is almost certainly the vulnerability the question wants you to flag \u2014 these protocols are explicitly called out as insecure in the framework.</div>\n    </div>\n\n    <div class=\"section-label\">Must-know terms</div>\n    <div class=\"card\">\n      <div class=\"glossary\">\n        <div class=\"gterm\"><b>Split tunneling (dual tunneling) \u2014</b> <span class=\"def\">when a VPN user's traffic is partly routed through the VPN and partly directly to the internet \u2014 a security risk because it can create an unmonitored path around the VPN's protections; VPN policies typically prohibit it.</span></div>\n        <div class=\"gterm\"><b>EAP \u2014</b> <span class=\"def\">extensible authentication protocol \u2014 used to authenticate wireless users against an approved authentication server.</span></div>\n        <div class=\"gterm\"><b>Port security (switch) \u2014</b> <span class=\"def\">a switch feature limiting which/how many devices can connect through a given port, preventing rogue devices and MAC flooding.</span></div>\n        <div class=\"gterm\"><b>WPA3 \u2014</b> <span class=\"def\">the current strongest standard wireless encryption protocol named in the framework.</span></div>\n      </div>\n    </div>\n\n    <div class=\"example walkthrough\">\n      <b class=\"step\">Worked example (matches Scenario 3B \u2014 Configuring a Secure Wireless Network):</b><br><br>\n      You're setting up a temporary secure wireless network in an emergency shelter after a natural disaster, with a satellite uplink providing internet.<br><br>\n      <b>Configuration choices to justify:</b> use WPA3 (not WEP/WPA) for encryption; disable beacon broadcasting or at minimum control signal strength so it doesn't extend past the shelter into the parking lot (war-driving/evil-twin exposure); consider whether MAC filtering is practical for a large transient population versus requiring simple authentication instead.<br><br>\n      <b>Trade-off to discuss:</b> disabling beacon frames improves security but adds friction for legitimate users, who now need to manually enter the SSID \u2014 a real operational cost during an emergency when ease-of-use matters.\n    </div>\n  ", "glossary": []}, {"id": "3.3", "title": "Protecting Networks: Segmentation", "lo": "3.3.A Identify techniques for segmenting a network &middot; 3.3.B Explain why segmentation increases network security", "quiz": [{"q": "A company places its public-facing web server in a network segment that sits between the internet and its internal private network, with a firewall on each side. This segment is best described as a:", "opts": ["VLAN", "Screened subnet (DMZ)", "Subnet mask", "Rogue access point"], "correct": 1, "explain": "A network zone sitting between the public internet and the internal network, hosting public-facing resources, is specifically defined as a screened subnet (DMZ)."}, {"q": "Why does dividing a network into smaller subnets improve security, according to the framework?", "opts": ["It makes every device on the network run faster", "It isolates network traffic, so an attack on one subnet is less likely to impact devices on other subnets", "It eliminates the need for any firewalls", "It automatically encrypts all traffic on the network"], "correct": 1, "explain": "Segmentation's core security benefit is traffic isolation \u2014 containing the impact of a compromise to one segment rather than letting it spread across the whole network."}, {"q": "An organization uses switches to logically separate devices that are all physically connected to the same central switch hardware, without needing separate physical wiring for each group. This technique is called:", "opts": ["Subnetting", "A VLAN", "A screened subnet", "Port security"], "correct": 1, "explain": "Creating logical (not physical) separation of devices connected to shared switch infrastructure is the definition of a VLAN."}], "html": "\n    <div class=\"section-label\">Core content</div>\n\n    <div class=\"card\">\n      <h3>Three segmentation techniques <span class=\"ekid\">3.3.A.1\u2013A.3</span></h3>\n      <ul>\n        <li><b>Screened subnet (DMZ)</b> \u2014 created using firewall zones and rules; a network segment sitting between the public internet and the internal, private network. Typically a <i>lower</i> security zone than the internal network, holding an organization's publicly facing resources and separating them from the internal network.</li>\n        <li><b>Subnetting</b> \u2014 creating different subnets based on IP addressing. If a device on one subnet is compromised, subnetting can contain the breach and reduce the number of exposed devices.</li>\n        <li><b>VLANs</b> \u2014 created using switches; logically separate devices that are physically connected to the same central switches, without needing separate physical hardware for each segment.</li>\n      </ul>\n    </div>\n\n    <div class=\"card\">\n      <h3>Why segmentation increases security <span class=\"ekid\">3.3.B.1\u2013B.4</span></h3>\n      <ul>\n        <li><b>Network segmentation</b> is the process of dividing a network into smaller, isolated segments (subnets).</li>\n        <li>Dividing into smaller subnets <b>isolates network traffic</b>, which can prevent attacks on one subnet from impacting devices on other subnets.</li>\n        <li>Segmentation allows <b>different security policies and controls</b> to be applied to different segments \u2014 enabling higher-security zones and lower-security zones within the same overall network.</li>\n        <li><b>Port security</b> on a switch specifically prevents MAC flooding by limiting the number of addresses assignable to any single switch port.</li>\n      </ul>\n      <div class=\"callout\"><b>Big picture:</b> segmentation is the network-layer expression of defense-in-depth's \"contain the blast radius\" principle \u2014 the same idea as Unit 2's physical zoning (restricted areas vs. public lobby), just applied to IP addressing and switch logic instead of doors and badges.</div>\n    </div>\n\n    <div class=\"section-label\">Must-know terms</div>\n    <div class=\"card\">\n      <div class=\"glossary\">\n        <div class=\"gterm\"><b>Screened subnet / DMZ \u2014</b> <span class=\"def\">a lower-security network zone between the internet and the internal network, holding public-facing resources like web servers.</span></div>\n        <div class=\"gterm\"><b>Subnetting \u2014</b> <span class=\"def\">dividing a network into smaller IP-address-based segments to contain breaches.</span></div>\n        <div class=\"gterm\"><b>VLAN \u2014</b> <span class=\"def\">a virtual local area network \u2014 logically (not physically) separates devices connected to the same switch infrastructure.</span></div>\n      </div>\n    </div>\n\n    <div class=\"example walkthrough\">\n      <b class=\"step\">Worked example (matches Scenario 3C \u2014 Protecting a Network on a Naval Submarine):</b><br><br>\n      A submarine has three distinct LANs: weapons systems, official naval operations, and crew recreation.<br><br>\n      <b>Segmentation approach:</b> each LAN should be a fully separate subnet (or VLAN) with its own security policy \u2014 weapons systems demanding the strictest controls (arguably no connection at all to the recreation LAN), official operations at a high-but-lower tier, and recreation as the lowest-security zone, similar in spirit to a DMZ, isolated from the more sensitive networks.<br><br>\n      <b>Why this matters:</b> if the recreation LAN (the most likely target for casual/low-skill compromise, e.g., crew browsing) were on the same segment as weapons systems, a single compromised recreation device could let an adversary move laterally into mission-critical systems. Segmentation prevents that.\n    </div>\n  ", "glossary": []}, {"id": "3.4", "title": "Protecting Networks: Firewalls", "lo": "3.4.A Identify types of network-based firewalls &middot; 3.4.B Explain ACL logic &middot; 3.4.C Determine effective firewall placement &middot; 3.4.D Configure a firewall", "quiz": [{"q": "An ACL has, in order: (1) DENY inbound TCP port 22 from ALL, (2) ALLOW inbound TCP port 22 from ALL. What happens to inbound SSH traffic?", "opts": ["It is allowed, because rule 2 is more specific", "It is denied, because rule 1 matches first and processing stops there", "Both rules apply simultaneously", "Neither rule applies since order doesn't matter"], "correct": 1, "explain": "ACL rules are evaluated in order, and the first matching rule is executed. Since rule 1 (DENY) matches first, the traffic is denied and rule 2 is never reached."}, {"q": "Which type of firewall adds deep packet inspection and application-level filtering on top of standard stateless and stateful capabilities?", "opts": ["Stateless firewall", "Stateful firewall", "Next-generation firewall (NGFW)", "Host-based firewall only"], "correct": 2, "explain": "An NGFW is defined as having both stateless and stateful capabilities plus additional advanced features like deep packet inspection, intrusion prevention, and application-type filtering."}, {"q": "A company has three network segments: a DMZ, an internal LAN, and a finance-only VLAN. According to the framework's firewall placement guidance, how many firewalls, at minimum, should be deployed?", "opts": ["Just one firewall at the internet boundary is sufficient for all three segments", "Each segment should have its own firewall controlling traffic in and out of that segment", "Firewalls are unnecessary if VLANs are already in use", "Only the finance-only VLAN needs a firewall since it's the most sensitive"], "correct": 1, "explain": "Per EK 3.4.C.1, every segment of a network should have a firewall controlling the flow of data in and out of that specific segment \u2014 not just a single perimeter firewall."}], "html": "\n    <div class=\"section-label\">Core content</div>\n\n    <div class=\"card\">\n      <h3>Three types of firewalls <span class=\"ekid\">3.4.A.1\u2013A.4</span></h3>\n      <p>A <b>firewall</b> allows or denies network traffic in or out of a network. It's software, which can run on a standalone device or be integrated into another network device like a router.</p>\n      <table class=\"compare-table\">\n        <tr><th>Type</th><th>How it filters</th></tr>\n        <tr><td class=\"label\">Stateless</td><td>Filters based on packet header info alone: IP addresses, ports, protocols. No memory of prior packets/connections.</td></tr>\n        <tr><td class=\"label\">Stateful (dynamic packet filtering)</td><td>Tracks the <i>state</i> of connections passing through, and can filter using connection-related rules in addition to everything a stateless firewall checks \u2014 more control over what's allowed.</td></tr>\n        <tr><td class=\"label\">Next-generation (NGFW)</td><td>Has both stateless and stateful capabilities <i>plus</i> advanced features: intrusion prevention, deep packet inspection, and filtering by application type.</td></tr>\n      </table>\n    </div>\n\n    <div class=\"card\">\n      <h3>How an ACL actually works <span class=\"ekid\">3.4.B.1\u2013B.3</span></h3>\n      <p>Network administrators create an <b>access control list (ACL)</b> \u2014 a set of rules a firewall uses to permit or deny inbound/outbound traffic.</p>\n      <ul>\n        <li><b>Rules are checked in order</b>, and the <i>first</i> rule that matches the traffic is the one that gets executed.</li>\n        <li>A typical rule specifies: direction (inbound/outbound), criterion to filter by (IP address, logical port, service, or application), and the action (permit or deny).</li>\n      </ul>\n      <div class=\"callout\"><b>This is the single highest-stakes mechanical skill in the whole course:</b> the free-response question is titled \"Device Security Analysis\" and virtually always includes a firewall ACL table you must read and reason about rule-by-rule, in order. Practice tracing traffic through a numbered rule list until you find the first match \u2014 top to bottom, stop at the first hit.</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>Worked ACL example \u2014 order changes the outcome <span class=\"ekid\">3.4.D.2\u2013D.3</span></h3>\n      <p>This ruleset allows SSH and denies all other inbound TCP:</p>\n      <table class=\"acl-table\">\n        <tr><th>Rule</th><th>Action</th><th>Direction</th><th>Protocol</th><th>Port</th><th>Source</th></tr>\n        <tr><td>1</td><td class=\"allow\">ALLOW</td><td>Inbound</td><td>TCP</td><td>22</td><td>ALL</td></tr>\n        <tr><td>2</td><td class=\"deny\">DENY</td><td>Inbound</td><td>TCP</td><td>ALL</td><td>ALL</td></tr>\n      </table>\n      <p><b>Reversing the order</b> (DENY-all first, then ALLOW SSH) would deny <i>all</i> inbound TCP traffic \u2014 including SSH \u2014 because the deny-all rule matches everything first and no traffic ever reaches rule 2. Order is not cosmetic; it changes real outcomes.</p>\n      <div class=\"code\">Allow inbound TCP port 22 from ALL;\n\u2192 permits all inbound TCP traffic to port 22 (SSH)\n\nDeny inbound TCP port 80 from 192.168.1.0/24;\n\u2192 denies inbound TCP traffic to port 80 (HTTP)\n   specifically from the 192.168.1.0\u2013192.168.1.255 range</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>Where to place firewalls <span class=\"ekid\">3.4.C.1\u2013C.3</span></h3>\n      <ul>\n        <li>Every segment of a network should have a firewall controlling the flow of data in and out of that segment.</li>\n        <li>Different segments can have different security needs \u2014 the security level for each firewall can be set independently.</li>\n        <li>Every point of data ingress/egress between the internal network and the public internet should have a firewall.</li>\n      </ul>\n    </div>\n\n    <div class=\"section-label\">Must-know terms</div>\n    <div class=\"card\">\n      <div class=\"glossary\">\n        <div class=\"gterm\"><b>ACL \u2014</b> <span class=\"def\">access control list \u2014 the ordered set of allow/deny rules a firewall executes.</span></div>\n        <div class=\"gterm\"><b>Stateful firewall \u2014</b> <span class=\"def\">tracks connection state, not just individual packet headers, for finer-grained filtering.</span></div>\n        <div class=\"gterm\"><b>NGFW \u2014</b> <span class=\"def\">next-generation firewall \u2014 adds deep packet inspection, intrusion prevention, and app-level filtering on top of stateless/stateful filtering.</span></div>\n      </div>\n    </div>\n\n    <div class=\"example walkthrough\">\n      <b class=\"step\">Worked example (matches the official sample MCQ #4 exactly \u2014 practice this pattern):</b><br><br>\n      A technician can't reach a server on port 443 from IP 192.168.45.37. The ACL:\n      <table class=\"acl-table\">\n        <tr><th>Rule</th><th>Allow/Deny</th><th>Direction</th><th>Protocol</th><th>Port</th><th>Source</th></tr>\n        <tr><td>1</td><td class=\"allow\">Allow</td><td>Inbound</td><td>TCP</td><td>22</td><td>ALL</td></tr>\n        <tr><td>2</td><td class=\"allow\">Allow</td><td>Inbound</td><td>TCP</td><td>80</td><td>ALL</td></tr>\n        <tr><td>3</td><td class=\"deny\">Deny</td><td>Inbound</td><td>TCP</td><td>443</td><td>192.168.0.0\u2013192.168.255.255</td></tr>\n        <tr><td>4</td><td class=\"allow\">Allow</td><td>Inbound</td><td>ICMP</td><td>ALL</td><td>ALL</td></tr>\n        <tr><td>7</td><td class=\"allow\">Allow</td><td>Inbound</td><td>TCP</td><td>443</td><td>ALL</td></tr>\n        <tr><td>10</td><td class=\"deny\">Deny</td><td>Inbound</td><td>ALL</td><td>ALL</td><td>ALL</td></tr>\n      </table>\n      Reading top to bottom: the technician's traffic (port 443, source in the 192.168.x.x range) hits <b>rule 3 first</b> \u2014 DENY \u2014 because 192.168.45.37 falls within 192.168.0.0\u2013192.168.255.255. Even though rule 7 would allow port 443 from anywhere, the connection never reaches rule 7 because rule 3 matched first and rules stop at the first match.<br><br>\n      <b>Fix:</b> swap rule 3 with rule 7 (moving the broader ALLOW ahead of the narrower DENY) \u2014 now port 443 traffic hits the ALLOW rule first, before the DENY rule that specifically blocks that IP range. This is the official answer to this exact sample question.\n    </div>\n  ", "glossary": []}, {"id": "3.5", "title": "Detecting Network Attacks", "lo": "3.5.A Identify automated detection tools &middot; 3.5.B Explain AI's role in detection &middot; 3.5.C Determine a detection method &middot; 3.5.D Evaluate detection method impact &middot; 3.5.E Apply detection techniques to log analysis", "quiz": [{"q": "A hospital deploys an automated tool that analyzes network traffic, generates alerts for suspicious activity, but takes no direct action to block or stop that traffic. Which tool is this?", "opts": ["Network intrusion prevention system (NIPS)", "Network intrusion detection system (NIDS)", "Data loss prevention (DLP) system", "Host-based firewall"], "correct": 1, "explain": "A tool that detects and alerts but does not take direct action to block traffic is, by definition, a NIDS \u2014 a NIPS would also be able to close ports or block addresses."}, {"q": "A network security team sets their AI-based detection threshold very low, so that almost any unusual traffic triggers an alert. What is the most likely consequence?", "opts": ["Real attacks will almost certainly go undetected", "The security team will be overwhelmed with false alerts, risking alert fatigue", "The network will automatically block all traffic", "The AI model will stop functioning entirely"], "correct": 1, "explain": "A threshold set too low means many normal events cross the alert bar, flooding the team with false positives \u2014 the opposite problem (missed attacks) happens when the threshold is set too high."}, {"q": "A network with highly consistent, predictable daily traffic patterns is a good candidate for which detection method, according to the framework?", "opts": ["Signature-based only", "Anomaly-based", "No detection is needed on consistent networks", "Physical detection controls only"], "correct": 1, "explain": "Anomaly-based detection specifically depends on a stable baseline of normal activity \u2014 it works best on networks with consistent traffic patterns, per EK 3.5.C.2."}, {"q": "A company's website experiences a sudden, otherwise inexplicable drop in traffic. Per the framework, what should be examined as a potential cause?", "opts": ["The company's DNS records, since DNS poisoning is difficult to detect directly", "The company's UPS battery levels", "The physical badge access logs", "The company's employee password policy"], "correct": 0, "explain": "EK 3.5.E.5 specifically notes that DNS poisoning is hard to detect directly, but an abrupt unexplained drop in traffic should prompt examining DNS records as a possible cause."}], "html": "\n    <div class=\"section-label\">Core content</div>\n\n    <div class=\"card\">\n      <h3>Automated detection tools <span class=\"ekid\">3.5.A.1\u2013A.4</span></h3>\n      <ul>\n        <li><b>NIDS (network intrusion detection system)</b> \u2014 analyzes data to determine if malicious activity is occurring; generates an alert when an attack is detected. Detects but does not act.</li>\n        <li><b>NIPS (network intrusion prevention system)</b> \u2014 does everything a NIDS does, <i>plus</i> can mitigate or halt an attack: closing ports, blocking specific IP/MAC addresses, or rejecting specific protocols.</li>\n        <li><b>SIEM</b> \u2014 collects and analyzes data from multiple sources (firewalls, NIDS/NIPS, device logs, application logs) to detect patterns that may indicate an attack, and raises an alert. Analysts then investigate to determine if it's a true threat and follow standard procedures to resolve or escalate.</li>\n      </ul>\n      <div class=\"callout\"><b>NIDS vs. NIPS, one more time:</b> \"generates an alert but does not take direct action to block traffic\" = NIDS. \"Can close ports or block addresses\" = NIPS. This exact distinction is the official sample MCQ #22.</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>NIDS vs. NIPS vs. SIEM</h3>\n      <table class=\"compare-table\">\n        <tr><th>Tool</th><th>Primary job</th><th>Key distinction</th></tr>\n        <tr><td class=\"label\">NIDS</td><td>Analyze network data and detect malicious activity</td><td>Generates an alert; does not directly stop the traffic.</td></tr>\n        <tr><td class=\"label\">NIPS</td><td>Analyze network data and prevent attacks</td><td>Can take corrective action such as closing ports or blocking addresses/protocols.</td></tr>\n        <tr><td class=\"label\">SIEM</td><td>Aggregate and analyze security data from many sources</td><td>Correlates information across firewalls, NIDS/NIPS, device logs, application logs, and other sources to identify patterns.</td></tr>\n      </table>\n      <div class=\"callout\"><b>Exam distinction:</b> NIDS/NIPS are network intrusion tools. SIEM is a broader aggregation and analysis system. A SIEM can consume alerts/logs from NIDS/NIPS, but it is not simply another name for either one.</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>Detection evidence: match the evidence to the attack</h3>\n      <p>For AP-style scenarios, do not merely name an attack. Identify the <b>specific observable evidence</b> that supports it. The evidence should come from the correct network component.</p>\n      <div class=\"grid\">\n        <div><b>GATEWAY / ARP TABLE</b>Conflicting IP-to-MAC mappings \u2192 possible ARP poisoning.</div>\n        <div><b>SWITCH / MAC TABLE</b>Many new MAC addresses or an unexpected surge of Ethernet frames \u2192 possible MAC flooding.</div>\n        <div><b>DNS RECORDS</b>Unexpected records or unexplained traffic changes \u2192 possible DNS poisoning.</div>\n        <div><b>WIRELESS ENVIRONMENT</b>Suspicious SSIDs or inability of devices to connect anywhere \u2192 evil twin/jamming clues.</div>\n        <div><b>TRAFFIC CAPTURE</b>Known malicious IPs, unauthorized scans, unusual spikes/slowdowns, or mismatched port/application traffic \u2192 network IoCs.</div>\n        <div><b>BROADCAST TRAFFIC</b>Sudden increase in ICMP requests to a broadcast address \u2192 possible smurf attack.</div>\n      </div>\n    </div>\n\n    <div class=\"card\">\n      <h3>Why false positives and false negatives matter</h3>\n      <ul>\n        <li><b>False positive:</b> the system flags benign activity as malicious. The security team wastes time investigating it; repeated false positives can produce alert fatigue.</li>\n        <li><b>False negative:</b> a real attack bypasses the detection system. The attack continues without detection and can cause loss, harm, disruption, or destruction.</li>\n        <li><b>High threshold:</b> fewer alerts, but some real attacks may be missed.</li>\n        <li><b>Low threshold:</b> more alerts, but many may be false positives and overwhelm responders.</li>\n      </ul>\n      <p>The correct threshold is therefore a <b>risk and operational decision</b>, not simply \u201cthe lower the threshold, the safer.\u201d</p>\n    </div>\n\n    <div class=\"card\">\n      <h3>Choosing signature, anomaly, or hybrid detection</h3>\n      <table class=\"compare-table\">\n        <tr><th>Scenario clue</th><th>Best fit</th><th>Reason</th></tr>\n        <tr><td class=\"label\">Very high traffic volume</td><td>Signature-based</td><td>Designed to process high-volume traffic efficiently and quickly.</td></tr>\n        <tr><td class=\"label\">Highly consistent traffic patterns</td><td>Anomaly-based</td><td>A reliable baseline can be established and deviations detected.</td></tr>\n        <tr><td class=\"label\">Highly sensitive/critical network</td><td>Hybrid</td><td>Combines known-attack and anomaly detection for stronger coverage, at higher cost and alert volume.</td></tr>\n        <tr><td class=\"label\">New attacks likely; hybrid too expensive</td><td>Anomaly-based</td><td>Signature-based cannot detect a genuinely new attack without a matching signature.</td></tr>\n      </table>\n    </div>\n\n    <div class=\"card\">\n      <h3>Why AI matters for network-scale detection <span class=\"ekid\">3.5.B.1\u2013B.4</span></h3>\n      <p>A medium-sized organization's network logs millions (or tens of millions) of data points per day \u2014 far beyond what even a large human team can analyze. AI algorithms classify data patterns as malicious or normal, reporting results as a <b>probability</b> (a percentage likelihood something is malicious) rather than a certainty. Organizations set their own <b>threshold</b> for what probability triggers an alert:</p>\n      <ul>\n        <li>Threshold set <b>too high</b> \u2192 real attacks may go undetected.</li>\n        <li>Threshold set <b>too low</b> \u2192 the security team gets overwhelmed with false alerts (alert fatigue again, this time at the network scale).</li>\n      </ul>\n    </div>\n\n    <div class=\"card\">\n      <h3>Choosing a detection method \u2014 the decision framework <span class=\"ekid\">3.5.C.1\u2013C.4</span></h3>\n      <table class=\"compare-table\">\n        <tr><th>Criterion</th><th>Signature-based</th><th>Anomaly-based</th></tr>\n        <tr>\n          <td class=\"label\">Traffic volume</td>\n          <td>More efficient for <b>high-volume</b> networks. Compares data to a database of known indicators of compromise (IoCs) called signatures \u2014 signature databases must stay updated for the latest attacks. Runs faster than anomaly-based.</td>\n          <td>N/A here \u2014 comparatively slower.</td>\n        </tr>\n        <tr>\n          <td class=\"label\">Traffic consistency</td>\n          <td>N/A here.</td>\n          <td>Most effective on networks with <b>consistent</b> traffic patterns. Compares data to a baseline of recorded activity from <b>uncompromised systems</b>; the baseline establishes expected data types and volumes. The system triggers when observed data falls outside a specified tolerance range.</td>\n        </tr>\n        <tr>\n          <td class=\"label\">Sensitivity/criticality</td>\n          <td colspan=\"2\">For highly sensitive/critical networks, organizations often use <b>hybrid detection</b> (both methods combined) \u2014 more expensive, and generates more alerts, but offers the strongest coverage.</td>\n        </tr>\n        <tr>\n          <td class=\"label\">Likelihood of novel attacks</td>\n          <td><b>Cannot</b> detect a brand-new attack \u2014 it needs an existing signature.</td>\n          <td>Preferred when new attacks are expected and hybrid detection is too costly, since it doesn't rely on a pre-known signature.</td>\n        </tr>\n      </table>\n    </div>\n\n    <div class=\"card\">\n      <h3>Evaluating the impact of a detection method <span class=\"ekid\">3.5.D.1\u2013D.4</span></h3>\n      <ul>\n        <li><b>Speed</b> \u2014 signature-based is faster than anomaly-based, especially on high-traffic networks.</li>\n        <li><b>Cost</b> \u2014 anomaly-based needs more expensive hardware than signature-based; hybrid is the most expensive of all, since it runs both.</li>\n        <li><b>False positive rate</b> \u2014 signature-based has almost no false positives; anomaly-based/hybrid have higher rates. High false-positive impacts: wasted investigation time, and <b>alert fatigue</b> (responders start assuming alerts are false before investigating).</li>\n        <li><b>False negative rate</b> \u2014 occurs when an adversary bypasses detection entirely. Signature-based is <i>easier</i> to bypass than anomaly-based or hybrid (since a novel or disguised attack has no matching signature). False negatives can lead to real loss, harm, disruption, or destruction.</li>\n      </ul>\n      <div class=\"callout\"><b>The core trade-off to internalize:</b> signature-based = fast, cheap, low false-positives, but blind to new attacks and easy to bypass. Anomaly-based = slower, pricier, more false alarms, but can catch novel attacks. Hybrid = best coverage, worst cost/alert volume. Every \"which method should this organization use\" question is really just this trade-off applied to a specific scenario.</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>Reading logs for specific network attack IoCs <span class=\"ekid\">3.5.E.1\u2013E.7</span></h3>\n      <table class=\"compare-table\">\n        <tr><th>Attack</th><th>What to look for in logs</th></tr>\n        <tr><td class=\"label\">Evil twin</td><td>Regularly scan for SSIDs that look suspicious or similar to legitimate local SSIDs; signal triangulation can locate and disable the rogue AP.</td></tr>\n        <tr><td class=\"label\">Jamming</td><td>No wireless devices in a physical space can connect; scan for electromagnetic (EM) noise in the wireless range.</td></tr>\n        <tr><td class=\"label\">ARP poisoning</td><td>Monitor for unusual ARP messages, particularly <b>duplicate MAC-address ARP packets</b>; check the ARP table on the default gateway.</td></tr>\n        <tr><td class=\"label\">MAC flooding</td><td>Monitor for an unexpected surge of Ethernet frames with different MAC addresses; check the MAC address table on a switch.</td></tr>\n        <tr><td class=\"label\">DNS poisoning</td><td><i>Difficult to detect directly</i> \u2014 but an abrupt, otherwise inexplicable drop in website traffic should prompt examining DNS records as a potential cause.</td></tr>\n        <tr><td class=\"label\">Smurf attack</td><td>Watch for a sudden increase in ICMP requests sent to the network's broadcast address.</td></tr>\n      </table>\n      <p><b>General network-based IoCs</b> found in packet captures include: connections to known malicious IP addresses; unauthorized network scans; unusual spikes/slowdowns in traffic; mismatched port-application traffic (e.g., HTTP traffic on a port normally used for something else).</p>\n    </div>\n\n    <div class=\"section-label\">Must-know terms</div>\n    <div class=\"card\">\n      <div class=\"glossary\">\n        <div class=\"gterm\"><b>Signature-based detection \u2014</b> <span class=\"def\">compares traffic against a database of known attack patterns; fast, low false-positives, but blind to novel attacks.</span></div>\n        <div class=\"gterm\"><b>Anomaly-based detection \u2014</b> <span class=\"def\">compares traffic to a baseline of normal activity; can catch novel attacks but is slower and generates more false positives.</span></div>\n        <div class=\"gterm\"><b>Hybrid detection \u2014</b> <span class=\"def\">combines signature- and anomaly-based methods; most coverage, highest cost and alert volume.</span></div>\n        <div class=\"gterm\"><b>False negative \u2014</b> <span class=\"def\">a real attack that the detection system fails to catch.</span></div>\n        <div class=\"gterm\"><b>Threshold (AI detection) \u2014</b> <span class=\"def\">the probability cutoff an organization sets for when a suspicious pattern triggers an alert.</span></div>\n      </div>\n    </div>\n\n    <div class=\"example walkthrough\">\n      <b class=\"step\">Worked example (matches Scenario 3B's detection-planning portion):</b><br><br>\n      You're recommending detective controls for the emergency-shelter wireless network from Topic 3.2, on a network with unpredictable, inconsistent traffic (varying number of displaced residents using it) but limited budget.<br><br>\n      <b>Reasoning:</b> anomaly-based detection is weakened here because traffic isn't consistent (EK 3.5.C.2 \u2014 anomaly-based needs consistent baselines to work well); a full hybrid approach is likely too costly for a temporary shelter setup. Signature-based detection is the more practical choice given the budget and traffic-volume constraints, accepting the trade-off that it can't catch a brand-new attack type.<br><br>\n      <b>Impact to note in the write-up:</b> choosing signature-based means faster detection and lower cost, but a corresponding higher risk of false negatives against any truly novel attack \u2014 an explicit trade-off, not a free win.\n    </div>\n  ", "glossary": []}]}, {"id": 4, "slug": "securing-devices", "title": "Unit 4 \u2014 Securing Devices", "meta": "~23 class periods \u00b7 Skills emphasized: Analyze Risk \u00b7 Mitigate Risk \u00b7 Detect Attacks", "topics": [{"id": "4.1", "title": "Device Vulnerabilities and Attacks", "lo": "4.1.A Device types \u00b7 4.1.B Malware \u00b7 4.1.C Device vulnerabilities \u00b7 4.1.D Device risk", "html": "\n<div class=\"section-label\">4.1.A \u2014 Types of computing devices</div>\n<div class=\"card\"><h3>Device categories</h3><table>\n<tr><th>Type</th><th>Definition</th><th>Examples / significance</th></tr>\n<tr><td class='term-label'>Server</td><td>Provides services to other computers.</td><td>DNS, DHCP, FTP, web, database, email. A compromise can affect many users.</td></tr>\n<tr><td class='term-label'>Personal computer</td><td>Designed for one person's work/recreation.</td><td>Desktop, laptop, notebook.</td></tr>\n<tr><td class='term-label'>Handheld</td><td>Smaller, battery-powered computer.</td><td>Phones, tablets, smart watches.</td></tr>\n<tr><td class='term-label'>Embedded</td><td>Computer integrated into a machine with specialized instructions; usually limited resources.</td><td>Controls a specific physical function.</td></tr>\n<tr><td class='term-label'>IoT</td><td>Everyday connected devices containing embedded computers.</td><td>Vehicles, infrastructure, medical equipment, appliances, thermostats.</td></tr></table>\n<div class=\"callout\"><b>Distinction:</b> server describes a role/service; personal, handheld, and embedded describe device categories. Any computer can provide services to others.</div></div>\n\n<div class=\"card\"><h3>Malware taxonomy \u2014 know the defining behavior</h3><table>\n<tr><th>Malware</th><th>Defining characteristic</th></tr>\n<tr><td class='term-label'>Virus</td><td>Must be activated by a user executing/opening a file.</td></tr>\n<tr><td class='term-label'>Worm</td><td>Spreads computer-to-computer without human interaction.</td></tr>\n<tr><td class='term-label'>Trojan</td><td>Malware embedded in software that appears harmless. A RAT is a trojan that gives remote access.</td></tr>\n<tr><td class='term-label'>Ransomware</td><td>Encrypts files, preventing access, and demands payment.</td></tr>\n<tr><td class='term-label'>Spyware</td><td>Tracks user actions and sends information to an adversary.</td></tr>\n<tr><td class='term-label'>Keylogger</td><td>Hardware/software that records keystrokes; credentials can be extracted.</td></tr>\n<tr><td class='term-label'>Logic bomb</td><td>Triggers only when specified conditions occur, such as date/time or OS conditions.</td></tr>\n<tr><td class='term-label'>Rootkit</td><td>Gets into the OS, can control nearly every aspect, and can hide itself from detection.</td></tr>\n<tr><td class='term-label'>Fileless malware</td><td>Malicious code lives in RAM and abuses legitimate installed programs rather than existing primarily as a file.</td></tr></table>\n<div class=\"callout\"><b>Exam distinctions:</b> virus = user activation; worm = no human interaction; trojan = disguised software; RAT = remote-access trojan; ransomware = encrypted files/payment; logic bomb = condition-triggered; rootkit = OS-level control/stealth; fileless = RAM/legitimate-program execution.</div></div>\n\n<div class=\"card\"><h3>How device vulnerabilities become attacks <span class='ekid'>4.1.C.1\u2013C.7</span></h3><table>\n<tr><th>Vulnerability</th><th>Attack path</th><th>Potential consequence</th></tr>\n<tr><td class='term-label'>Unpatched OS/software</td><td>Exploit a known vulnerability for which a fix exists.</td><td>Crash system, view user actions, control components, steal/destroy data.</td></tr>\n<tr><td class='term-label'>Weak authentication</td><td>Guess password or socially engineer it from the user.</td><td>Impersonation and unauthorized access.</td></tr>\n<tr><td class='term-label'>No BIOS/UEFI password</td><td>Boot recovery/special mode or external OS and alter accounts/passwords.</td><td>Higher-level access that bypasses normal OS authentication.</td></tr>\n<tr><td class='term-label'>Autorun</td><td>Insert external drive containing malware that executes automatically.</td><td>Malware installation/control.</td></tr>\n<tr><td class='term-label'>Open ports</td><td>Connect to exposed services.</td><td>Unauthorized access or service exploitation.</td></tr>\n<tr><td class='term-label'>No/misconfigured firewall</td><td>Host cannot filter malicious data sent to it.</td><td>Disruption or attempted takeover.</td></tr>\n<tr><td class='term-label'>No anti-malware</td><td>Malware can be installed without endpoint scanning as a defense.</td><td>Disruption, control, theft, destruction.</td></tr></table></div>\n\n<div class=\"section-label\">4.1.D \u2014 Assessing device risk</div>\n<div class=\"card\"><p>Risk depends on the device's <b>criticality</b>, the services it provides, the data it stores, likelihood of exploitation, and the consequences of compromise.</p>\n<p><span class='risk-badge high'>HIGH</span> Potential compromise of sensitive data or critical operations.</p>\n<p><span class='risk-badge mod'>MODERATE</span> Weak authentication or vulnerabilities that are less likely to be exploited, with meaningful but less severe impact.</p>\n<p><span class='risk-badge low'>LOW</span> Vulnerability whose exploitation would have little impact.</p>\n<table><tr><th>Framework-style example</th><th>Reasoning</th></tr><tr><td class='term-label'>Unpatched critical email server</td><td>High: known critical vulnerability on an important service.</td></tr><tr><td class='term-label'>Water-treatment pump without MFA</td><td>Moderate: weak authentication creates an attack path.</td></tr><tr><td class='term-label'>Employee laptop with Telnet port 23 open</td><td>Low when exploitation would have little impact.</td></tr></table></div>\n<div class=\"example\"><b>Integrated scenario:</b> connected farm equipment with remote control and infrequent updates has an embedded/IoT computer, an unpatched OS, and an exposed remote-management service. Trace: device \u2192 vulnerabilities \u2192 exploit/unauthorized connection \u2192 loss of control or operational disruption \u2192 potentially high risk because critical physical operations are affected.</div>", "quiz": [], "glossary": []}, {"id": "4.2", "title": "Authentication", "lo": "4.2.A Hashes \u00b7 4.2.B Password attacks \u00b7 4.2.C Authentication factors \u00b7 4.2.D Secure login configuration", "html": "\n<div class=\"section-label\">4.2.A \u2014 Cryptographic hashes</div>\n<div class=\"card\"><h3>Hash fundamentals</h3><p>A cryptographic hash function takes binary data of arbitrary length and produces a fixed-length binary string called a hash, checksum, or message digest.</p><table>\n<tr><th>Property</th><th>Meaning</th></tr><tr><td class='term-label'>Fixed length</td><td>One hash function always outputs the same number of bits.</td></tr><tr><td class='term-label'>Repeatable</td><td>Same input \u2192 same output.</td></tr><tr><td class='term-label'>Pre-image resistant</td><td>Given a hash, it should be infeasible to recover the original input.</td></tr><tr><td class='term-label'>Collision resistant</td><td>It should be difficult to find two different inputs with the same output.</td></tr></table><p>Named examples include MD5, SHA-1, SHA-256, SHA-512, NTHash, and RIPEMD-160.</p></div>\n<div class=\"card\"><h3>Collisions</h3><p>An n-bit hash has <b>2<sup>n</sup></b> possible outputs, but infinitely many possible inputs. Therefore, different inputs must eventually share an output. That is a <b>collision</b>.</p><div class=\"example\"><b>Exam logic:</b> if two files have the same output under Function 2 but different outputs under Function 1, the evidence supports a collision in Function 2. It does not prove the files are identical.</div></div>\n<div class=\"card\"><h3>Why passwords use hashes</h3><p>A system can store a password-derived hash instead of the plaintext password. During login, the submitted password is processed and compared with the stored value.</p><p>Hashing protects against immediate disclosure of plaintext passwords if a database is stolen, but weak passwords can still be guessed offline by hashing candidate passwords.</p><p><b>Salt:</b> random data added before hashing so equal passwords do not produce equal stored hashes. Salting makes precomputed rainbow-table lookups much less useful.</p><div class=\"callout\"><b>Hashing is not encryption:</b> encryption is intended to be reversible with a key; hashing is designed as a one-way transformation with properties such as pre-image resistance.</div></div>\n\n<div class=\"section-label\">4.2.B \u2014 Password attacks</div>\n<div class=\"card\"><table><tr><th>Attack</th><th>What happens</th><th>Key distinction</th></tr>\n<tr><td class='term-label'>Online password attack</td><td>Attempts passwords against a live login service.</td><td>Creates authentication attempts; account lockout can limit it.</td></tr>\n<tr><td class='term-label'>Offline password attack</td><td>Cracks a stolen password/hash database on the adversary's own system.</td><td>Target login controls cannot stop the cracking process.</td></tr>\n<tr><td class='term-label'>Brute force</td><td>Systematically tries possible passwords.</td><td>Longer passwords expand the search space.</td></tr>\n<tr><td class='term-label'>Dictionary</td><td>Tries likely words, common passwords, patterns, and variations.</td><td>Predictable personal information helps adversaries build guesses.</td></tr>\n<tr><td class='term-label'>Password spraying</td><td>One/few common passwords against many accounts.</td><td>Spreads attempts across accounts.</td></tr>\n<tr><td class='term-label'>Credential stuffing</td><td>Uses leaked/known username-password pairs.</td><td>Reused passwords create cross-service risk.</td></tr></table></div>\n\n<div class=\"section-label\">4.2.C \u2014 Authentication factors</div>\n<div class=\"card\"><table><tr><th>Factor</th><th>Meaning</th><th>Examples</th></tr>\n<tr><td class='term-label'>Knowledge</td><td>Something you know.</td><td>Password, PIN, security question.</td></tr><tr><td class='term-label'>Possession</td><td>Something you have.</td><td>Access card, token, phone/OTP.</td></tr><tr><td class='term-label'>Biometric</td><td>Something you are.</td><td>Fingerprint, palm, face, iris/retina, voice.</td></tr><tr><td class='term-label'>Location</td><td>Somewhere you are.</td><td>GPS, IP address, time zone, Wi-Fi location.</td></tr></table><p><b>MFA</b> requires at least two separate factor types. Two passwords are still one factor category.</p></div>\n\n<div class=\"section-label\">4.2.D \u2014 Secure login configuration</div>\n<div class=\"card\"><ul><li><b>Password complexity:</b> require organizationally defined character/construction requirements.</li><li><b>Minimum length:</b> longer passwords expand the search space.</li><li><b>Maximum password age:</b> controls how long credentials remain valid when policy requires periodic changes.</li><li><b>Password history:</b> prevents reuse of recent passwords.</li><li><b>Account lockout:</b> locks an account after a defined number of invalid attempts for a defined period, limiting online guessing.</li></ul><div class=\"callout\"><b>Do not confuse:</b> history prevents reuse; lockout limits repeated failed logins; password age controls credential lifetime.</div></div>", "quiz": [], "glossary": []}, {"id": "4.3", "title": "Protecting Devices", "lo": "4.3.A Managerial controls \u00b7 4.3.B Anti-malware \u00b7 4.3.C Updates \u00b7 4.3.D Host-based firewalls", "html": "\n<div class=\"section-label\">4.3.A \u2014 Managerial controls</div>\n<div class=\"card\"><table><tr><th>Policy</th><th>Purpose</th></tr><tr><td class='term-label'>Acceptable use</td><td>Rules for appropriate device use, prohibited websites/site types, required updates, peripheral rules, and external-media restrictions.</td></tr><tr><td class='term-label'>Password policy</td><td>Length/age, reuse restrictions, construction requirements, and password-management practices.</td></tr><tr><td class='term-label'>Software installation policy</td><td>Who may install software, approval/request process, and pre-approved software.</td></tr></table><p>Managerial controls establish required behavior and configuration standards; they complement technical controls.</p></div>\n\n<div class=\"section-label\">4.3.B \u2014 Anti-malware</div>\n<div class=\"card\"><p>Anti-malware can periodically scan device files and compare them with a database of known malware <b>signatures</b>. A matching malicious file can be quarantined and removed.</p><table><tr><th>Strength</th><th>Limitation</th></tr><tr><td class='term-label'>Known malware</td><td>Effective when a current signature exists.</td></tr><tr><td class='term-label'>Efficiency</td><td>Generally uses fewer resources than anomaly-based detection.</td></tr><tr><td class='term-label'>New malware</td><td>No matching signature means signature-based detection may miss it.</td></tr><tr><td class='term-label'>Fileless malware</td><td>RAM-resident malicious code using legitimate programs is harder for file scanning to identify.</td></tr></table></div>\n\n<div class=\"section-label\">4.3.C \u2014 Updates and patches</div>\n<div class=\"card\"><p>When an OS/software vulnerability is discovered, its maintainer can release an update. A small update is a <b>patch</b>.</p><p>Keeping software current prevents adversaries from exploiting <b>known vulnerabilities</b>. Unpatched systems are therefore exposed to documented weaknesses that may already have public exploits.</p><div class=\"callout\"><b>Risk connection:</b> the importance of patching depends on what the device controls/stores. A known critical vulnerability on a critical server is much more consequential than the same type of weakness on a low-impact device.</div></div>\n\n<div class=\"section-label\">4.3.D \u2014 Host-based firewalls</div>\n<div class=\"card\"><p>A <b>host-based firewall</b> runs on one device and allows/denies traffic entering or leaving that device. It provides an additional layer if the network around the host is compromised.</p><table><tr><th>ACL field</th><th>Possible criterion</th></tr><tr><td class='term-label'>Direction</td><td>Inbound/outbound.</td></tr><tr><td class='term-label'>IP</td><td>Source/destination address.</td></tr><tr><td class='term-label'>Port</td><td>Network service endpoint.</td></tr><tr><td class='term-label'>Protocol</td><td>TCP, UDP, ICMP, etc.</td></tr><tr><td class='term-label'>Service/application</td><td>Specific service or application.</td></tr><tr><td class='term-label'>Action</td><td>Allow/deny.</td></tr></table><p>Rules are processed in order. The <b>first matching rule</b> determines the result.</p></div>\n<div class=\"card\"><h3>Outbound traffic is part of device security</h3><p>A host firewall can block outbound traffic. For example, blocking outbound FTP can prevent an adversary with remote access from using FTP to exfiltrate a file.</p><p>Host firewalls should block ports/services that the device does not need.</p><div class=\"code\">1  ALLOW inbound TCP 443 from ALL\n2  DENY  inbound TCP 22  from ALL\n3  ALLOW inbound TCP 22  from 10.0.0.0/8\n4  DENY  inbound ALL      from ALL\n\nSSH from 10.2.5.8 \u2192 Rule 2 matches first \u2192 DENIED.</div><div class=\"callout\"><b>First-match rule:</b> never skip directly to a later, more specific-looking rule. Evaluate from the top and stop at the first match.</div></div>\n\n<div class=\"section-label\">Must-know distinctions</div>\n<div class=\"card\"><table><tr><td class='term-label'>Anti-malware vs firewall</td><td>Anti-malware detects/removes malicious software; firewall filters network traffic.</td></tr><tr><td class='term-label'>Patch vs anti-malware</td><td>Patch fixes a known software vulnerability; anti-malware detects/removes malware.</td></tr><tr><td class='term-label'>Network vs host firewall</td><td>Network firewall protects network boundaries/segments; host firewall protects one device.</td></tr><tr><td class='term-label'>Inbound vs outbound</td><td>Inbound enters the host; outbound leaves it. Both can be dangerous.</td></tr></table></div>", "quiz": [], "glossary": []}, {"id": "4.4", "title": "Detecting Attacks on Devices", "lo": "4.4.A Device IoCs \u00b7 4.4.B Detection controls \u00b7 4.4.C Detection impact \u00b7 4.4.D Password-attack logs", "html": "\n<div class=\"section-label\">4.4.A \u2014 Logs and IoCs</div>\n<div class=\"card\"><p>Systems can log processes/settings, login attempts, file downloads, and user actions. Logs can reconstruct circumstances before and during an incident.</p><p>An <b>indicator of compromise (IoC)</b> is evidence that an adversary has compromised a device or network.</p><table><tr><th>IoC type</th><th>Where</th><th>Examples</th></tr><tr><td class='term-label'>Host-based</td><td>Logs/configuration</td><td>Unusual files; unexpected processes/services; unauthorized config changes; unauthorized software install/update.</td></tr><tr><td class='term-label'>File-based</td><td>Files, especially executables</td><td>Known-malware hash; known malicious filename; suspicious path.</td></tr><tr><td class='term-label'>Behavior-based</td><td>Authentication/access logs</td><td>Repeated failed logins; unusual time/location; unauthorized sensitive-data access; privilege-elevation attempts.</td></tr></table></div>\n\n<div class=\"section-label\">4.4.B \u2014 Choosing a detection control</div>\n<div class=\"card\"><table><tr><th>Criterion</th><th>Question</th><th>Framework implication</th></tr><tr><td class='term-label'>Performance</td><td>Can the device handle the resource use?</td><td>Anomaly-based detection uses more resources than signature-based. Signature-based fits less powerful devices. Some embedded devices cannot run local detection at all.</td></tr><tr><td class='term-label'>Cost</td><td>Can licenses/infrastructure be afforded?</td><td>EDR can provide centralized detection across devices but is expensive.</td></tr><tr><td class='term-label'>Criticality</td><td>How severe would compromise be?</td><td>Highly sensitive/critical devices justify stronger detection when feasible.</td></tr></table></div>\n\n<div class=\"section-label\">4.4.C \u2014 Detection impact</div>\n<div class=\"card\"><ul><li><b>Performance:</b> detection consumes CPU/memory and can slow constrained devices.</li><li><b>Coverage:</b> signature-based is efficient but can miss novel threats; anomaly-based can identify deviations but is more resource-intensive.</li><li><b>Criticality:</b> important devices may justify more expensive detection.</li><li><b>Embedded constraints:</b> if local detection is impossible, monitoring may need to occur elsewhere.</li></ul><div class=\"callout\"><b>Do not optimize one variable blindly.</b> The correct method balances performance, cost, and sensitivity/criticality.</div></div>\n\n<div class=\"section-label\">4.4.D \u2014 Password-attack log analysis</div>\n<div class=\"card\"><p>Authentication logs record attempted logins. Analyze <b>patterns</b>, not isolated events.</p><table><tr><th>Observed pattern</th><th>Likely interpretation</th></tr><tr><td class='term-label'>Many failures against one account</td><td>Possible online password attack.</td></tr><tr><td class='term-label'>One common password across many accounts</td><td>Password spraying.</td></tr><tr><td class='term-label'>Known/leaked credential pairs</td><td>Credential stuffing.</td></tr><tr><td class='term-label'>Successful login from unusual time/location</td><td>Possible compromised credentials; behavior-based IoC.</td></tr><tr><td class='term-label'>Unauthorized sensitive-data access</td><td>Behavior-based IoC.</td></tr><tr><td class='term-label'>Privilege-elevation attempt</td><td>Behavior-based IoC.</td></tr><tr><td class='term-label'>Offline hash cracking</td><td>Not visible in target login logs; the cracking happens on the adversary's system.</td></tr></table></div>\n\n<div class=\"card\"><h3>Systematic authentication-log analysis</h3><ol><li><b>Group by account:</b> find accounts with repeated failures.</li><li><b>Group by source:</b> find IPs/devices generating many attempts.</li><li><b>Compare users:</b> one source targeting many accounts suggests spraying.</li><li><b>Check timing:</b> bursts can indicate automation.</li><li><b>Look for success after failure:</b> especially suspicious.</li><li><b>Check location:</b> compare with normal user activity.</li><li><b>Check subsequent actions:</b> authentication success does not prove legitimate use.</li></ol><div class=\"callout\"><b>AP response standard:</b> when identifying an IoC, cite specific evidence from the log: account, time, source, number of failures, successful login, location, privilege change, or resource accessed.</div></div>\n\n<div class=\"example\"><b>Integrated scenario:</b> one account receives 19 failed logins from an unfamiliar source within two minutes, followed by a successful login at 02:13. The failures indicate a possible online password attack; the success afterward raises concern that credentials were obtained/guessed; the unusual source/time is a behavior-based IoC. Investigate the account and subsequent activity rather than treating one event as proof of compromise.</div>\n\n<div class=\"section-label\">Must-know distinctions</div>\n<div class=\"card\"><table><tr><td class='term-label'>IoC vs attack</td><td>An IoC is evidence suggesting compromise; it is not necessarily the attack itself.</td></tr><tr><td class='term-label'>Host/file/behavior IoC</td><td>Host = system/config evidence; file = suspicious file evidence; behavior = suspicious activity pattern.</td></tr><tr><td class='term-label'>Online/offline password attack</td><td>Online interacts with the target login system; offline cracks stolen data elsewhere.</td></tr><tr><td class='term-label'>Spraying/stuffing</td><td>Spraying uses common password(s) across many accounts; stuffing uses known credential pairs.</td></tr></table></div>", "quiz": [], "glossary": []}]}, {"id": 5, "slug": "securing-applications-and-data", "title": "Unit 5 \u2014 Securing Applications and Data", "meta": "~30 class periods \u00b7 Skills emphasized: Analyze Risk \u00b7 Mitigate Risk \u00b7 Detect Attacks", "topics": [{"id": "5.1", "title": "Application and Data Vulnerabilities and Attacks", "lo": "5.1.A Exploit application/file vulnerabilities \u00b7 5.1.B Explain application attacks \u00b7 5.1.C Assess and document risk", "html": "\n<div class=\"section-label\">5.1.A \u2014 Foundational vulnerabilities</div>\n<div class=\"card\"><h3>Unencrypted files, excessive privilege, and weak access control <span class='ekid'>5.1.A.1\u2013A.3</span></h3>\n<ul>\n<li>An adversary who gains access to a device or drive can read an <b>unencrypted file</b>. Encryption protects the contents if the storage is stolen or accessed.</li>\n<li><b>Administrative users</b> can control system settings and typically access applications and files across the system. Giving ordinary users administrative privileges increases the consequences of account compromise.</li>\n<li><b>Weak access controls</b> may let users view or edit files they should not. This can cause confidentiality breaches, unauthorized modification, destruction, or application disruption.</li>\n</ul>\n<div class=\"callout\"><b>Least-privilege reasoning:</b> the issue is not simply \u201cadmins are bad.\u201d The risk comes from giving an account more authority than necessary. If that account is compromised, the adversary inherits its privileges.</div></div>\n\n<div class=\"section-label\">5.1.B \u2014 Four application attacks</div>\n<div class=\"card\"><h3>Data validation is the common defensive concept <span class='ekid'>5.1.B.1\u2013B.2</span></h3>\n<p>Applications receive user input. <b>Data validation</b> checks that the input meets expected criteria before the application processes it. For example, a field asking for a quantity should reject input that does not fit the expected format. Failure to validate input creates opportunities for injection attacks, where unexpected characters or commands alter program behavior.</p>\n<div class=\"flow\"><b>User input</b> \u2192 validation/sanitization \u2192 expected data \u2192 normal processing<br><b>Unvalidated input</b> \u2192 unexpected characters/commands \u2192 application interprets attacker-controlled input</div></div>\n\n<div class=\"card\"><h3>SQL injection <span class='ekid'>5.1.B.3\u2013B.4</span></h3>\n<p><b>SQL</b> is a language used to request information from databases and modify database entries. If an application builds database queries from unvalidated user input, an adversary can insert SQL commands/control characters into the input field.</p>\n<table><tr><th>Potential effect</th><th>CIA connection</th></tr><tr><td class='term-label'>Return unauthorized records</td><td>Confidentiality breach</td></tr><tr><td class='term-label'>Modify database records</td><td>Integrity breach</td></tr><tr><td class='term-label'>Delete records</td><td>Integrity and potentially availability impact</td></tr></table>\n<div class=\"example\"><b>Recognition clue:</b> application logs containing SQL control syntax, quotes, boolean conditions such as <code>OR 1=1</code>, or SQL keywords in an input field can indicate attempted SQL injection. The exact malicious string is less important than recognizing that user input is being interpreted as SQL.</div></div>\n\n<div class=\"card\"><h3>Cross-site scripting (XSS) <span class='ekid'>5.1.B.5\u2013B.6</span></h3>\n<p>Web pages use HTML and often JavaScript. JavaScript executed in a user's browser can interact with information available to that browser. In an <b>XSS attack</b>, an adversary injects malicious code into a website so a victim's browser executes it.</p>\n<table><tr><th>Type</th><th>Mechanism</th><th>Key clue</th></tr><tr><td class='term-label'>Reflected / Type I</td><td>Malicious code is embedded in a link/request the victim clicks or sends.</td><td>The payload is reflected from the request.</td></tr><tr><td class='term-label'>Stored / Type II</td><td>Malicious code is inserted into the website, such as a comment or forum post.</td><td>Other users visiting the page can be affected.</td></tr></table>\n<div class=\"callout\"><b>Exam distinction:</b> SQL injection targets an application's interaction with a database. XSS targets the browser by causing injected JavaScript/code to execute.</div></div>\n\n<div class=\"card\"><h3>Buffer overflow <span class='ekid'>5.1.B.7\u2013B.8</span></h3>\n<p>A <b>buffer</b> is a fixed-size section of memory used to hold data. If an application writes more data than the buffer can hold, the extra data can overwrite adjacent memory. A buffer-overflow attack can crash a system or cause code to execute outside the intended security policy, potentially allowing unauthorized file access, modification, or deletion.</p>\n<div class=\"example\"><b>Recognition chain:</b> input exceeds fixed memory allocation \u2192 adjacent memory overwritten \u2192 crash or unintended code execution \u2192 unauthorized actions.</div></div>\n\n<div class=\"card\"><h3>Directory traversal <span class='ekid'>5.1.B.9\u2013B.10</span></h3>\n<p>Web applications store files in server directories. A browser can request resources through HTTP GET requests. In a <b>directory traversal attack</b>, an adversary manipulates the requested path to move outside the intended directory and attempt to access sensitive files.</p>\n<div class=\"code\">GET /images/../../../etc/passwd HTTP/1.1</div>\n<p>The sequence <code>../</code> means \u201cmove up one directory.\u201d Repeated traversal sequences can attempt to reach sensitive locations such as system files.</p>\n</div>\n\n<div class=\"section-label\">5.1.C \u2014 Risk assessment</div>\n<div class=\"card\"><h3>Confidentiality, integrity, availability <span class='ekid'>5.1.C.1</span></h3>\n<table><tr><th>Risk</th><th>What happens</th></tr><tr><td class='term-label'>Confidentiality</td><td>Unauthorized people can access sensitive data.</td></tr><tr><td class='term-label'>Integrity</td><td>Data can be altered from its intended state.</td></tr><tr><td class='term-label'>Availability</td><td>Data can be destroyed or encrypted so authorized users can
