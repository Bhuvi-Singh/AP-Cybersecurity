not access it.</td></tr></table></div>\n\n<div class=\"card\"><h3>AP framework risk tiers <span class='ekid'>5.1.C.2\u2013C.4</span></h3>\n<p><span class='risk-badge high'>HIGH</span> Highly sensitive/regulated data exposed through a highly likely exploit.</p>\n<div class=\"example\">Example: technical specifications for a critical aircraft stored unencrypted on a drive.</div>\n<p><span class='risk-badge mod'>MODERATE</span> Sensitive data protected by encryption or access controls that are not strong enough.</p>\n<div class=\"example\">Example: customer PII stored in a spreadsheet encrypted with a small key.</div>\n<p><span class='risk-badge low'>LOW</span> Less-sensitive information with weaker encryption or access controls.</p>\n<div class=\"example\">Example: low-sensitivity executive memos on an unencrypted share with weak access restrictions.</div>\n<div class=\"callout\"><b>Do not invent risk from the vulnerability alone.</b> Risk depends on what the data/application is worth, how likely exploitation is, and how severe the consequences would be.</div></div>\n\n<div class=\"section-label\">Must-know distinctions</div>\n<div class=\"card\"><table><tr><td class='term-label'>Validation vs. sanitization</td><td>Validation checks whether input meets expected criteria. Sanitization removes/rejects potentially dangerous input so it cannot manipulate the application.</td></tr><tr><td class='term-label'>SQL injection vs. XSS</td><td>SQL injection manipulates database queries; XSS injects code executed by a victim's browser.</td></tr><tr><td class='term-label'>Buffer overflow vs. directory traversal</td><td>Buffer overflow abuses fixed memory allocation; directory traversal abuses filesystem path handling.</td></tr></table></div>", "quiz": [], "glossary": []}, {"id": "5.2", "title": "Managerial Controls and Access Controls", "lo": "5.2.A Data state/classification \u00b7 5.2.B Managerial controls \u00b7 5.2.C Access-control models \u00b7 5.2.D Linux permissions", "html": "\n<div class=\"section-label\">5.2.A \u2014 Data state and classification</div>\n<div class=\"card\"><h3>Data at rest, in transit, and in use <span class='ekid'>5.2.A.1\u2013A.3</span></h3>\n<table><tr><th>State</th><th>Meaning</th><th>Primary security reasoning</th></tr><tr><td class='term-label'>At rest</td><td>Stored on a drive.</td><td>Protect the physical storage from theft/destruction and encrypt the stored data so stolen storage cannot immediately be read.</td></tr><tr><td class='term-label'>In transit</td><td>Being sent from one device to another.</td><td>Protect the communication medium and encrypt the data so interception does not immediately reveal its contents.</td></tr><tr><td class='term-label'>In use</td><td>Being processed by software or a person.</td><td>Use access controls to determine who/what can view or edit it. The framework states that data must be unencrypted to be used.</td></tr></table>\n<div class=\"callout\"><b>Memory hook:</b> rest = storage, transit = movement, use = processing. Encryption is especially relevant to confidentiality at rest/in transit; access control is central to controlling use.</div></div>\n\n<div class=\"card\"><h3>Sensitivity and regulated data <span class='ekid'>5.2.A.3\u2013A.5</span></h3>\n<p>Organizations classify data according to sensitivity and generally apply stronger protections to more sensitive information. Laws and regulations can impose additional requirements for how certain data are stored, transmitted, and handled.</p>\n<table><tr><th>Data</th><th>Meaning</th><th>Framework examples</th></tr><tr><td class='term-label'>PII</td><td>Personally identifiable information that can identify an individual.</td><td>Name, signature, phone, address, biometrics, SSN, DOB, email.</td></tr><tr><td class='term-label'>PHI</td><td>Information related to an individual's health, treatment, or healthcare payment.</td><td>Test results, treatment records, hospital records, provider notes.</td></tr><tr><td class='term-label'>PCI</td><td>Payment-card information used to process card payments.</td><td>Name, account number, expiration date, address, CVV.</td></tr></table>\n<p>Organizations handling regulated data should label/classify it and establish policies that satisfy applicable legal or regulatory requirements.</p></div>\n\n<div class=\"section-label\">5.2.B \u2014 Managerial controls</div>\n<div class=\"card\"><h3>Cryptography policy <span class='ekid'>5.2.B.1</span></h3><p>A cryptography policy establishes what cryptographic protections are acceptable. It may specify:</p><ul><li>Approved encryption algorithms for specific uses</li><li>Minimum or maximum key lengths</li><li>Key-generation requirements and parameters</li><li>Key-storage requirements</li></ul></div>\n<div class=\"card\"><h3>Web application security policy <span class='ekid'>5.2.B.2</span></h3><p>A web application security policy defines requirements for testing and mitigating application vulnerabilities. It may specify when an application requires a security assessment, how quickly vulnerabilities must be remediated according to risk, and which tools or security frameworks are used.</p></div>\n\n<div class=\"section-label\">5.2.C \u2014 Access-control models</div>\n<div class=\"card\"><h3>Access-control vocabulary <span class='ekid'>5.2.C.1</span></h3><p><b>Subjects</b> are users or applications requesting access. <b>Objects</b> are files or applications being accessed. <b>Operations</b> are actions such as view/read, modify/write, add, or remove/delete.</p><div class=\"flow\"><b>Subject</b> \u2192 requests \u2192 <b>operation</b> \u2192 on \u2192 <b>object</b></div></div>\n<div class=\"card\"><h3>Four access-control models <span class='ekid'>5.2.C.2\u2013C.5</span></h3>\n<table><tr><th>Model</th><th>How access is determined</th><th>Scenario clue</th></tr><tr><td class='term-label'>RBAC</td><td>Permissions are assigned to roles; subjects receive roles.</td><td>\u201cAccountants can access payroll; interns cannot.\u201d</td></tr><tr><td class='term-label'>RuBAC</td><td>Access is determined by explicit rules/conditions.</td><td>\u201cOnly during business hours and only from corporate devices.\u201d</td></tr><tr><td class='term-label'>DAC</td><td>Owners of objects can determine who else has access.</td><td>\u201cThe file owner chooses which users can read it.\u201d</td></tr><tr><td class='term-label'>MAC</td><td>Access is determined by centrally assigned classifications/labels and security clearances; users cannot change permissions at will.</td><td>\u201cConfidential/Secret classifications control access.\u201d</td></tr></table>\n<div class=\"callout\"><b>Exam trap:</b> \u201crole\u201d = RBAC; \u201ccondition/rule\u201d such as time or device = RuBAC; \u201cowner chooses\u201d = DAC; \u201cclassification/clearance\u201d = MAC.</div></div>\n\n<div class=\"card\"><h3>Bell-LaPadula model <span class='ekid'>5.2.C.6</span></h3><p>Bell-LaPadula is an access-control model designed to protect <b>confidentiality</b>. Its two key properties are commonly remembered as:</p><table><tr><td class='term-label'>Simple Security Property</td><td><b>No read up.</b> A subject cannot read an object at a higher classification level.</td></tr><tr><td class='term-label'>* (Star) Security Property</td><td><b>No write down.</b> A subject cannot write information to an object at a lower classification level.</td></tr></table><div class=\"callout\"><b>Mnemonic:</b> \u201cwrite up, read down\u201d (WURD). A Secret subject may read Confidential data, but may not write Secret information down into a Confidential object.</div></div>\n\n<div class=\"section-label\">5.2.D \u2014 Linux permissions and chmod</div>\n<div class=\"card\"><h3>Reading Linux permissions <span class='ekid'>5.2.D.1\u2013D.4</span></h3><p>Linux permissions use three default entities in this order: <b>owner, group, others</b>. Each entity can have read (<code>r</code>), write (<code>w</code>), and execute (<code>x</code>) permissions.</p>\n<div class=\"code\">-rwxr-x---</div>\n<p>Break it into <code>rwx | r-x | ---</code>: owner = read/write/execute; group = read/execute; others = no access.</p>\n<p><code>ls -l</code> displays the current permissions. If a <code>+</code> appears after the permission string, additional permissions have been set and can be viewed with <code>getfacl</code>.</p></div>\n\n<div class=\"card\"><h3>chmod numeric method <span class='ekid'>5.2.D.5\u2013D.6</span></h3>\n<table><tr><th>Value</th><th>Permission</th></tr><tr><td class='term-label'>0</td><td>---</td></tr><tr><td class='term-label'>1</td><td>--x</td></tr><tr><td class='term-label'>2</td><td>-w-</td></tr><tr><td class='term-label'>3</td><td>-wx</td></tr><tr><td class='term-label'>4</td><td>r--</td></tr><tr><td class='term-label'>5</td><td>r-x</td></tr><tr><td class='term-label'>6</td><td>rw-</td></tr><tr><td class='term-label'>7</td><td>rwx</td></tr></table>\n<p>Syntax: <code>chmod ### filename</code>. First digit = owner, second = group, third = others.</p>\n<div class=\"code\">chmod 750 test\nowner  = 7 = rwx\ngroup  = 5 = r-x\nothers = 0 = ---\n\nchmod 640 report.txt\nowner  = 6 = rw-\ngroup  = 4 = r--\nothers = 0 = ---</div></div>\n\n<div class=\"card\"><h3>chmod symbolic method <span class='ekid'>5.2.D.7</span></h3><p>Entities: <code>u</code> owner, <code>g</code> group, <code>o</code> others, <code>a</code> all. Operators: <code>+</code> add, <code>-</code> remove. Permissions: <code>r</code>, <code>w</code>, <code>x</code>.</p><div class=\"code\">chmod ug+rx testfile\n# add read + execute for owner and group\n\nchmod o-r testfile\n# remove read permission from others</div></div>\n\n<div class=\"example\"><b>Worked permission problem:</b> If the owner needs read/write, the group needs read-only, and everyone else needs no access, use <code>rw- | r-- | ---</code> \u2192 6-4-0 \u2192 <code>chmod 640 filename</code>.</div>", "quiz": [], "glossary": []}, {"id": "5.3", "title": "Protecting Stored Data with Symmetric Cryptography", "lo": "5.3.A Explain encryption \u00b7 5.3.B Apply symmetric encryption algorithms", "html": "\n<div class=\"section-label\">5.3.A \u2014 Cryptography fundamentals</div>\n<div class=\"card\"><h3>Plaintext \u2192 ciphertext \u2192 plaintext <span class='ekid'>5.3.A.1\u2013A.3</span></h3><p><b>Cryptography</b> is used to hide information. <b>Encryption</b> transforms readable plaintext into ciphertext. <b>Decryption</b> reverses the process using the appropriate key.</p><div class=\"flow\"><b>Plaintext</b> + encryption algorithm + <b>key</b> \u2192 <b>ciphertext</b><br><b>Ciphertext</b> + decryption algorithm + appropriate <b>key</b> \u2192 <b>plaintext</b></div><p>The <b>keyspace</b> is the number of possible keys. A larger keyspace means more possible guesses and therefore makes random key discovery more difficult.</p></div>\n\n<div class=\"card\"><h3>Symmetric vs. asymmetric encryption <span class='ekid'>5.3.A.4</span></h3><table><tr><th>Symmetric</th><th>Asymmetric</th></tr><tr><td>One shared key encrypts and decrypts.</td><td>Two related keys are used; one encrypts and the other decrypts.</td></tr><tr><td>Efficient for protecting data/files.</td><td>Useful when parties need secure communication without first sharing a secret key.</td></tr><tr><td>Main challenge: securely sharing the secret key.</td><td>Main challenge: protecting the private key.</td></tr></table></div>\n\n<div class=\"card\"><h3>Block vs. stream encryption <span class='ekid'>5.3.A.5</span></h3><table><tr><td class='term-label'>Block encryption</td><td>Processes information in fixed-size chunks called blocks. Each input block produces an output block.</td></tr><tr><td class='term-label'>Stream encryption</td><td>Processes input continuously, producing output one element at a time.</td></tr></table></div>\n\n<div class=\"section-label\">5.3.B \u2014 AES</div>\n<div class=\"card\"><h3>Advanced Encryption Standard (AES) <span class='ekid'>5.3.B.1\u2013B.2</span></h3><p><b>AES</b> is the most common symmetric encryption algorithm named in the framework. It is a <b>symmetric block cipher</b> that encrypts data in <b>128-bit blocks (16 bytes)</b>. AES can use different key lengths. Within AES, longer keys provide stronger protection but require more computational work.</p><table><tr><th>Concept</th><th>What to remember</th></tr><tr><td class='term-label'>AES-128</td><td>128-bit key; less secure than AES-256 within the AES family.</td></tr><tr><td class='term-label'>AES-256</td><td>256-bit key; larger keyspace than AES-128.</td></tr><tr><td class='term-label'>Block size</td><td>AES processes 128 bits / 16 bytes at a time, regardless of whether the key is 128, 192, or 256 bits.</td></tr></table><div class=\"callout\"><b>Do not confuse key length with block size.</b> AES-256 means a 256-bit key, not a 256-bit block. AES still processes 128-bit blocks.</div></div>\n\n<div class=\"card\"><h3>Applying AES with OpenSSL <span class='ekid'>5.3.B.3\u2013B.4</span></h3><p>The framework gives command-line examples using OpenSSL. The password supplied in these examples is used to derive the encryption key.</p><div class=\"code\"># Encrypt\nopenssl enc -aes-128-cbc -e -in test -k password -out test.enc\n\n# Decrypt\nopenssl enc -aes-128-cbc -d -in test.enc -k password -out text</div><p>For the AP exam, focus on recognizing the workflow: the same symmetric secret is needed to decrypt what was encrypted.</p></div>\n\n<div class=\"section-label\">Core cryptography distinctions</div>\n<div class=\"card\"><table><tr><td class='term-label'>Encryption</td><td>Protects confidentiality by making data unreadable without the appropriate key.</td></tr><tr><td class='term-label'>Hashing</td><td>Produces a digest used for verification/integrity or password storage; it is not reversible encryption.</td></tr><tr><td class='term-label'>Keyspace</td><td>Number of possible keys.</td></tr><tr><td class='term-label'>Key length</td><td>More bits means a larger keyspace for the same algorithm.</td></tr></table></div>", "quiz": [], "glossary": []}, {"id": "5.4", "title": "Asymmetric Cryptography", "lo": "5.4.A Choose the correct key \u00b7 5.4.B Explain key length \u00b7 5.4.C Apply asymmetric encryption", "html": "\n<div class=\"section-label\">5.4.A \u2014 Public and private keys</div>\n<div class=\"card\"><h3>The key-pair model <span class='ekid'>5.4.A.1\u2013A.3</span></h3><p>Asymmetric encryption allows secure communication <b>without prearranging a shared secret key</b>. Each receiver generates a pair of related keys: a <b>public key</b> and a <b>private key</b>.</p><table><tr><td class='term-label'>Public key</td><td>Published openly. Others can use it to encrypt information intended for the owner.</td></tr><tr><td class='term-label'>Private key</td><td>Kept secret by its owner. It is used to decrypt information encrypted with the paired public key.</td></tr></table><div class=\"callout\"><b>Private-key rule:</b> if a private key is exposed, shared, stolen, corrupted, or compromised, the key pair must be deleted and a new pair generated. The security of the scheme depends on the private key remaining secret.</div></div>\n\n<div class=\"card\"><h3>Which key do I use?</h3><table><tr><th>Goal</th><th>Correct operation</th></tr><tr><td class='term-label'>Send Bob a secret message</td><td>Encrypt with <b>Bob's public key</b>. Bob decrypts with Bob's private key.</td></tr><tr><td class='term-label'>Receive a secret message</td><td>Decrypt using <b>your private key</b>.</td></tr></table><div class=\"flow\"><b>Alice</b> encrypts with <b>Bob's public key</b> \u2192 ciphertext \u2192 <b>Bob</b> decrypts with <b>Bob's private key</b></div></div>\n\n<div class=\"section-label\">5.4.B \u2014 Key length and keyspace</div>\n<div class=\"card\"><h3>Why longer keys are harder to guess <span class='ekid'>5.4.B.1\u2013B.5</span></h3><p>An <b>n-bit binary key</b> has <b>2<sup>n</sup></b> possible values. If an adversary guesses randomly, the average number of guesses needed is approximately half the keyspace, <b>2<sup>n\u22121</sup></b>.</p><table><tr><td class='term-label'>128-bit key</td><td>2<sup>128</sup> possible keys.</td></tr><tr><td class='term-label'>256-bit key</td><td>2<sup>256</sup> possible keys.</td></tr></table><p>Longer keys generally increase security but also increase computational work. As processing power improves, recommended key lengths can increase.</p><div class=\"callout\"><b>Critical AP rule:</b> compare key lengths only within the <i>same cryptographic algorithm</i>. AES-256 cannot be declared \u201cmore secure\u201d than RSA-2048 simply because 256 is smaller/larger; those numbers describe different algorithms and are not directly comparable.</div></div>\n\n<div class=\"section-label\">5.4.C \u2014 Applying asymmetric encryption</div>\n<div class=\"card\"><h3>RSA, ECC, and practical use <span class='ekid'>5.4.C.1</span></h3><p>Common asymmetric algorithms include <b>RSA</b> and <b>elliptic curve cryptography (ECC)</b>. Asymmetric algorithms are used in applications including digital signatures and digital certificates.</p><p>For the AP framework's encrypted-message scenario, the important sequence is:</p><ol><li>Receiver generates an asymmetric key pair.</li><li>Receiver securely stores the private key and publishes the public key.</li><li>Sender obtains the receiver's public key.</li><li>Sender encrypts the message using the receiver's public key.</li><li>Receiver decrypts using the receiver's private key.</li></ol></div>\n\n<div class=\"card\"><h3>OpenSSL-style workflow</h3><div class=\"code\"># Generate a key pair (conceptual example)\n# Share the PUBLIC key only.\n\n# Sender encrypts using receiver's public key.\n# Receiver decrypts using their own PRIVATE key.</div><p>The exam is more likely to test <b>which key</b> is used and why than command syntax itself. Never transmit or publish a private key.</p></div>\n\n<div class=\"section-label\">Asymmetric cryptography traps</div>\n<div class=\"card\"><table><tr><td class='term-label'>\u201cEncrypt with my private key so only I can read it.\u201d</td><td>Wrong for confidentiality. Use the recipient's public key.</td></tr><tr><td class='term-label'>\u201cAnyone can have my private key because my public key is public.\u201d</td><td>Wrong. Public/private secrecy is asymmetric: public is shared; private must remain secret.</td></tr><tr><td class='term-label'>\u201cRSA-4096 is automatically twice as secure as RSA-2048.\u201d</td><td>Do not reason linearly. Keyspace grows exponentially with key bits.</td></tr></table></div>", "quiz": [], "glossary": []}, {"id": "5.5", "title": "Protecting Applications", "lo": "5.5.A Secure by design/default \u00b7 5.5.B Input sanitization", "html": "\n<div class=\"section-label\">5.5.A \u2014 Secure by design</div>\n<div class=\"card\"><h3>Security is a development principle, not a patch <span class='ekid'>5.5.A.1\u2013A.2</span></h3><p><b>Secure by design</b> means security is incorporated throughout product development, including the design phase, rather than being added only after a product is built.</p><table><tr><td class='term-label'>1. Ownership</td><td>Companies should take responsibility for customer security outcomes and build products that meet customers' security needs.</td></tr><tr><td class='term-label'>2. Transparency + accountability</td><td>Organizations should share relevant security news and updates quickly so affected users can protect themselves.</td></tr><tr><td class='term-label'>3. Leadership + structure</td><td>Organizations need leadership and organizational structures focused on security with a security-first posture.</td></tr></table></div>\n\n<div class=\"card\"><h3>Secure by default <span class='ekid'>5.5.A.3</span></h3><p><b>Secure by default</b> means security features are enabled automatically. A device or application should be reasonably secure \u201cout of the box\u201d rather than requiring every user to discover and enable important protections manually.</p><div class=\"callout\"><b>Design vs. default:</b> secure by design is the broader development philosophy. Secure by default is specifically about the initial configuration users receive.</div></div>\n\n<div class=\"section-label\">5.5.B \u2014 User-input sanitization</div>\n<div class=\"card\"><h3>Why special characters matter <span class='ekid'>5.5.B.1</span></h3><p>Applications often surround or process user input using <b>control characters</b>. The framework specifically names the single quote, double quote, and semicolon. If an application interprets these characters as part of a command rather than ordinary data, an adversary may manipulate the application's behavior.</p></div>\n<div class=\"card\"><h3>Sanitization and attack prevention <span class='ekid'>5.5.B.2</span></h3><p>Programmers should use a verification function to ensure input meets expected criteria and does not contain control characters that could manipulate the system. The function can:</p><ul><li>Remove potentially malicious characters, or</li><li>Reject the input and require the user to provide a different value.</li></ul><p>This can protect against <b>SQL injection, XSS, and directory traversal</b>.</p><div class=\"flow\"><b>Untrusted input</b> \u2192 validate expected format \u2192 sanitize/reject dangerous content \u2192 process safe input</div></div>\n\n<div class=\"card\"><h3>Match the defense to the attack</h3><table><tr><th>Attack</th><th>Why sanitization helps</th></tr><tr><td class='term-label'>SQL injection</td><td>Prevents SQL control characters/commands from being interpreted as part of the database query.</td></tr><tr><td class='term-label'>XSS</td><td>Prevents malicious script/code from being accepted and later executed in a browser.</td></tr><tr><td class='term-label'>Directory traversal</td><td>Prevents malicious path-control sequences from escaping the intended directory.</td></tr></table></div>\n\n<div class=\"callout\"><b>Important limitation:</b> input sanitization is one layer of defense. Strong application security also depends on access controls, secure design, secure defaults, patching, and detection. Do not assume one control eliminates every application vulnerability.</div>", "quiz": [], "glossary": []}, {"id": "5.6", "title": "Detecting Attacks on Data and Applications", "lo": "5.6.A Data detection \u00b7 5.6.B Control selection \u00b7 5.6.C Impact \u00b7 5.6.D Hash verification \u00b7 5.6.E Application logs", "html": "\n<div class=\"section-label\">5.6.A \u2014 Detecting attacks on data</div>\n<div class=\"card\"><h3>Accounting and access logs <span class='ekid'>5.6.A.1</span></h3><p><b>Accounting</b> is recording and monitoring user activity. Devices can log when data are accessed and by whom. Reviewing those logs can reveal attempts to access, copy, move, or delete data.</p><table><tr><th>Suspicious activity</th><th>Why it matters</th></tr><tr><td class='term-label'>Accessing unusual files</td><td>The user may be exploring data outside their normal responsibilities.</td></tr><tr><td class='term-label'>Unusual time/location/device</td><td>Activity deviates from the user's normal behavior.</td></tr><tr><td class='term-label'>Copying sensitive files</td><td>Could indicate data theft/exfiltration.</td></tr><tr><td class='term-label'>Deleting sensitive files</td><td>Could indicate destructive activity or an attempt to hide evidence.</td></tr></table></div>\n\n<div class=\"card\"><h3>Honeypots <span class='ekid'>5.6.A.2</span></h3><p>A <b>honeypot file</b> appears to contain valuable information such as credit-card data, PII, or passwords, but its contents are fake. Because legitimate users have no reason to access it, an access attempt can be treated as an indicator of malicious activity.</p><div class=\"callout\"><b>Why it is powerful:</b> a honeypot can have a very low false-positive rate when access is genuinely unauthorized because there is no legitimate reason for normal users to open it.</div></div>\n\n<div class=\"card\"><h3>Hashes as integrity evidence <span class='ekid'>5.6.A.3</span></h3><p>A cryptographic hash function produces a repeatable digest. If a file's hash changes unexpectedly, the file was altered and that change can be an indicator of malicious activity.</p><div class=\"flow\"><b>Known-good file</b> \u2192 calculate hash \u2192 record digest<br>Later \u2192 calculate hash again \u2192 compare<br><b>Same hash</b> \u2192 no detected change &nbsp;&nbsp; <b>Different hash</b> \u2192 file changed</div><div class=\"callout\"><b>Critical limitation:</b> a hash detects alteration, not every kind of theft. An adversary can view/copy a file without modifying it, and the hash may remain unchanged.</div></div>\n\n<div class=\"section-label\">5.6.B\u2013C \u2014 Selecting and evaluating detection controls</div>\n<div class=\"card\"><h3>Three selection criteria <span class='ekid'>5.6.B.1\u2013B.3</span></h3><table><tr><td class='term-label'>Cost</td><td>Honeypots and hash checks are relatively inexpensive. DLP services can provide stronger monitoring at higher cost.</td></tr><tr><td class='term-label'>Sensitivity / criticality</td><td>More sensitive or critical data/applications are more attractive targets and should generally receive closer monitoring.</td></tr><tr><td class='term-label'>Classification</td><td>Private, educational, healthcare, and financial data may have legal/regulatory monitoring requirements.</td></tr></table></div>\n\n<div class=\"card\"><h3>Real-time vs. retrospective detection <span class='ekid'>5.6.C.1\u2013C.2</span></h3><table><tr><th>Method</th><th>Timing</th><th>Strength</th></tr><tr><td class='term-label'>Honeypot</td><td>Near instantaneous</td><td>Can alert immediately when someone accesses the fake data.</td></tr><tr><td class='term-label'>Real-time DLP / automated log analysis</td><td>During the attack</td><td>Allows prompt response and may stop an attack before more damage occurs.</td></tr><tr><td class='term-label'>Retrospective log analysis</td><td>After activity</td><td>Can reconstruct suspicious access but may be too slow to prevent the original damage.</td></tr><tr><td class='term-label'>Hash comparison</td><td>After a comparison is made</td><td>Strong evidence that a file changed, but does not identify every type of compromise.</td></tr></table><p>Because organizations generate large amounts of log data, automation can be necessary to analyze logs at an effective speed.</p></div>\n\n<div class=\"section-label\">5.6.D \u2014 Verifying whether a file changed</div>\n<div class=\"card\"><h3>Hash verification workflow <span class='ekid'>5.6.D.1\u2013D.3</span></h3><p>Hashing is repeatable: the same input produces the same output for the same hash function. Calculate a file's hash, record it, and calculate it again later. A changed hash indicates the file was altered between measurements.</p><div class=\"code\">Windows PowerShell:\nGet-FileHash testfile -Algorithm SHA256\n\nBASH:\nsha256sum testfile\n\nzsh:\nshasum -a 256 testfile</div><div class=\"callout\"><b>Exam reasoning:</b> if two hash values for the same file are different, the file changed. If two different files have the same hash, that is a collision; it does not prove the files are identical.</div></div>\n\n<div class=\"section-label\">5.6.E \u2014 Application-attack indicators in logs</div>\n<div class=\"card\"><h3>SQL injection indicators <span class='ekid'>5.6.E.1</span></h3><p>Review application/server logs for suspicious user input containing SQL control characters and syntax.</p><table><tr><td class='term-label'>Quotes</td><td>Single or double quote characters can be used to alter query syntax.</td></tr><tr><td class='term-label'>Boolean conditions</td><td>Examples include <code>OR 1=1</code>.</td></tr><tr><td class='term-label'>SQL comment marker</td><td><code>--</code> can cause the remainder of a SQL statement to be treated as a comment.</td></tr><tr><td class='term-label'>SQL keywords</td><td>Words such as <code>WHERE</code>, <code>IN</code>, and <code>FROM</code> appearing unexpectedly in user input.</td></tr></table></div>\n\n<div class=\"card\"><h3>XSS indicators <span class='ekid'>5.6.E.2</span></h3><p>Review user input for suspicious HTML/script tags, especially <code>&lt;script&gt; ... &lt;/script&gt;</code>. Such input can indicate an attempt to inject JavaScript that a browser will execute.</p></div>\n\n<div class=\"card\"><h3>Buffer-overflow indicators <span class='ekid'>5.6.E.3</span></h3><p>For web applications, examine the amount of data submitted in requests. Suspiciously long strings can indicate an attempt to exceed a memory buffer.</p><table><tr><td class='term-label'>URL length</td><td>Unusually long URL.</td></tr><tr><td class='term-label'>Cookie length</td><td>Unusually large cookie data.</td></tr><tr><td class='term-label'>Query-string length</td><td>Unexpectedly large query parameters.</td></tr><tr><td class='term-label'>Total request length</td><td>Request body/overall size is unusually large.</td></tr></table></div>\n\n<div class=\"card\"><h3>Directory traversal indicators <span class='ekid'>5.6.E.4</span></h3><p>Review application/server logs for HTTP GET requests containing repeated <code>../</code> path sequences. These indicate an attempt to move upward through the server filesystem.</p><div class=\"code\">GET /images/../../../../etc/passwd HTTP/1.1</div></div>\n\n<div class=\"section-label\">Detection master table</div>\n<div class=\"card\"><table><tr><th>Evidence in logs</th><th>Likely attack</th></tr><tr><td class='term-label'><code>OR 1=1</code>, quotes, <code>--</code>, SQL keywords</td><td>SQL injection</td></tr><tr><td class='term-label'><code>&lt;script&gt;</code> or suspicious script tags</td><td>XSS</td></tr><tr><td class='term-label'>Unusually long URL/cookie/query/request</td><td>Possible buffer overflow</td></tr><tr><td class='term-label'><code>../</code> sequences in GET paths</td><td>Directory traversal</td></tr><tr><td class='term-label'>Unusual file access/copy/delete</td><td>Possible data compromise/exfiltration</td></tr><tr><td class='term-label'>Unexpected file hash</td><td>File alteration</td></tr><tr><td class='term-label'>Access to fake valuable file</td><td>Honeypot-triggered malicious activity</td></tr></table></div>\n\n<div class=\"section-label\">What detection can and cannot tell you</div>\n<div class=\"card\"><table><tr><td class='term-label'>Hash changed</td><td>You can conclude the file changed. You cannot conclude exactly who changed it or why without additional evidence.</td></tr><tr><td class='term-label'>Honeypot accessed</td><td>Strong indicator of suspicious activity because legitimate access should not occur.</td></tr><tr><td class='term-label'>SQL syntax in input</td><td>Evidence of an attempted SQL injection; it does not necessarily prove the attack succeeded.</td></tr><tr><td class='term-label'>403 response to traversal request</td><td>Evidence of an attempted traversal even if the server blocked it.</td></tr></table></div>", "quiz": [], "glossary": []}]}];

/* ======================================================================
   RENDER ENGINE
   Reads UNITS and builds: unit tabs, unit header, topic sidebar,
   topic content (including glossary + quiz, with placeholder states),
   and prev/next navigation. No per-unit custom JS required going
   forward — every unit renders through this same engine.
====================================================================== */
let currentUnit = 0;
let currentTopic = 0;

const unitTabsEl = document.getElementById('unitTabs');
const unitCrumbEl = document.getElementById('unitCrumb');
const unitTitleEl = document.getElementById('unitTitle');
const unitMetaEl = document.getElementById('unitMeta');
const topicRailEl = document.getElementById('topicRail');
const topicsContainerEl = document.getElementById('topicsContainer');

function renderQuiz(topic, ti){
  if(!topic.quiz || topic.quiz.length === 0){
    return `<div class="section-label">Check your understanding</div>
      <div class="quiz-placeholder">Practice questions for this topic haven't been added yet.</div>`;
  }
  return `<div class="section-label">Check your understanding</div>
    <div class="quiz-block">
      ${topic.quiz.map((q,qi)=>`
        <div class="q">
          <div class="quiz-stem">${qi+1}. ${q.q}</div>
          <div class="quiz-opts" data-qidx="${qi}" data-tidx="${ti}">
            ${q.opts.map((o,oi)=>`<button class="quiz-opt" data-oi="${oi}">${o}</button>`).join('')}
          </div>
          <div class="quiz-explain" id="exp-${ti}-${qi}">${q.explain || ''}</div>
        </div>
      `).join('')}
    </div>`;
}

function renderGlossary(topic){
  if(!topic.glossary || topic.glossary.length === 0) return '';
  return `<div class="section-label">Must-know terms</div>
    <div class="card"><div class="glossary">
      ${topic.glossary.map(g=>`
        <div class="gterm"><b>${g.term}</b> — <span class="def">${g.def}</span>${g.ek ? `<span class="ekid">${g.ek}</span>`:''}</div>
      `).join('')}
    </div></div>`;
}

function renderUnit(){
  const unit = UNITS[currentUnit];
  unitCrumbEl.textContent = `ap-cybersecurity / unit-${unit.id} / ${unit.slug}`;
  unitTitleEl.textContent = unit.title;
  unitMetaEl.textContent = unit.meta;

  // Switching units should show the topic list again on mobile, since
  // the person needs to pick a topic in the new unit.
  document.getElementById('sidebar').setAttribute('data-collapsed', 'false');
  document.getElementById('sidebarToggle').setAttribute('aria-expanded', 'true');

  // topic sidebar
  topicRailEl.innerHTML = '';
  unit.topics.forEach((t,i)=>{
    const b = document.createElement('button');
    b.className = 'rail-btn';
    b.innerHTML = `<span class="n">${t.id}</span><span>${t.title}</span>`;
    b.onclick = () => { currentTopic = i; renderTopics(true); };
    topicRailEl.appendChild(b);
  });

  // topic content
  topicsContainerEl.innerHTML = '';
  unit.topics.forEach((t,i)=>{
    const sec = document.createElement('section');
    sec.className = 'topic';
    sec.id = 'topic-' + i;
    sec.innerHTML = `
      <div class="topic-head">
        <div class="topic-eyebrow">Topic ${t.id}</div>
        <h2>${t.title}</h2>
        <div class="topic-lo">${t.lo || ''}</div>
      </div>
      ${t.html || ''}
      ${renderGlossary(t)}
      ${renderQuiz(t, i)}
      <div class="nav-foot">
        <button class="prev-btn">← prev</button>
        <span class="pos"></span>
        <button class="next-btn">next →</button>
      </div>
    `;
    topicsContainerEl.appendChild(sec);
  });

  wireQuizzes(unit);
  wireTopicNav();
  renderTopics();
}

function wireQuizzes(unit){
  unit.topics.forEach((t,ti)=>{
    (t.quiz||[]).forEach((q,qi)=>{
      const container = document.querySelector(`.quiz-opts[data-tidx="${ti}"][data-qidx="${qi}"]`);
      if(!container) return;
      container.querySelectorAll('.quiz-opt').forEach((btn,oi)=>{
        btn.addEventListener('click', ()=>{
          if(container.dataset.answered) return;
          container.dataset.answered = "1";
          container.querySelectorAll('.quiz-opt').forEach((b2,oi2)=>{
            b2.disabled = true;
            if(oi2 === q.correct) b2.classList.add('correct');
            else if(oi2 === oi) b2.classList.add('wrong');
          });
          const exp = document.getElementById(`exp-${ti}-${qi}`);
          if(exp) exp.classList.add('show');
        });
      });
    });
  });
}

function wireTopicNav(){
  document.querySelectorAll('.prev-btn').forEach(b=>{
    b.onclick = () => { if(currentTopic>0){ currentTopic--; renderTopics(); } };
  });
  document.querySelectorAll('.next-btn').forEach(b=>{
    b.onclick = () => {
      const unit = UNITS[currentUnit];
      if(currentTopic < unit.topics.length-1){ currentTopic++; renderTopics(); }
    };
  });
}

function goToPrevTopic(){ if(currentTopic>0){ currentTopic--; renderTopics(); } }
function goToNextTopic(){
  const unit = UNITS[currentUnit];
  if(currentTopic < unit.topics.length-1){ currentTopic++; renderTopics(); }
}

function savePosition(){
  try{
    localStorage.setItem('ap-cybersecurity-position', JSON.stringify({unit: currentUnit, topic: currentTopic}));
  }catch(e){}
}

function renderTopics(collapseSidebarOnMobile){
  const unit = UNITS[currentUnit];
  document.querySelectorAll('.topic').forEach((el,i)=>el.classList.toggle('active', i===currentTopic));
  document.querySelectorAll('.rail-btn').forEach((el,i)=>el.classList.toggle('active', i===currentTopic));
  document.querySelectorAll('.pos').forEach(el=>{
    el.textContent = `Topic ${unit.topics[currentTopic].id} · ${currentTopic+1} of ${unit.topics.length}`;
  });
  document.querySelectorAll('.prev-btn').forEach(b=> b.disabled = currentTopic===0);
  document.querySelectorAll('.next-btn').forEach(b=> b.disabled = currentTopic===unit.topics.length-1);
  document.querySelector('.main').scrollTo({top:0, behavior:'instant'});
  // On mobile, only collapse the topic list when the person just picked a
  // topic from it (a deliberate action) — not on first load or after
  // switching units, when the list should stay visible so they can choose.
  if(collapseSidebarOnMobile && window.innerWidth <= 860){
    document.getElementById('sidebar').setAttribute('data-collapsed', 'true');
    document.getElementById('sidebarToggle').setAttribute('aria-expanded', 'false');
  }
  savePosition();
}

function renderUnitTabs(){
  unitTabsEl.innerHTML = '';
  UNITS.forEach((u,i)=>{
    const b = document.createElement('button');
    b.className = 'unit-tab' + (i===currentUnit ? ' active' : '');
    b.textContent = `Unit ${u.id}`;
    b.onclick = () => { currentUnit = i; currentTopic = 0; renderUnitTabs(); renderUnit(); };
    unitTabsEl.appendChild(b);
  });
}

/* ============ Sidebar collapse (mobile) ============ */
const sidebarEl = document.getElementById('sidebar');
const sidebarToggleEl = document.getElementById('sidebarToggle');
sidebarToggleEl.addEventListener('click', () => {
  const collapsed = sidebarEl.getAttribute('data-collapsed') === 'true';
  sidebarEl.setAttribute('data-collapsed', collapsed ? 'false' : 'true');
  sidebarToggleEl.setAttribute('aria-expanded', collapsed ? 'true' : 'false');
});

/* ============ Keyboard navigation ============
   Left/Right arrow keys move between topics — a natural fit for a study
   tool where someone is reading through a unit sequentially. Ignored
   while typing in a form field (none currently exist, but this keeps
   the behavior safe if inputs are added later) and while a quiz option
   button has focus, so arrow keys don't accidentally skip a question
   before it's answered. */
document.addEventListener('keydown', (e) => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  if(document.activeElement && document.activeElement.classList.contains('quiz-opt')) return;
  if(e.key === 'ArrowRight'){ goToNextTopic(); }
  else if(e.key === 'ArrowLeft'){ goToPrevTopic(); }
});

/* ============ Theme ============ */
const themeToggle = document.getElementById('themeToggle');
let currentTheme = localStorage.getItem('ap-cybersecurity-theme') || 'light';

function applyTheme(theme){
  currentTheme = theme === 'dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', currentTheme);
  localStorage.setItem('ap-cybersecurity-theme', currentTheme);
  themeToggle.textContent = currentTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
}
themeToggle.addEventListener('click', () => applyTheme(currentTheme === 'dark' ? 'light' : 'dark'));

/* ============ Init ============
   Restore the last unit/topic the person was reading, so returning to
   the guide (e.g. the next day) picks up where they left off instead of
   always resetting to Unit 1 / Topic 1.1. Falls back safely to 0/0 if
   nothing is saved yet, or if saved indices no longer fit (e.g. after
   content is edited/reordered later). */
(function restorePosition(){
  try{
    const saved = JSON.parse(localStorage.getItem('ap-cybersecurity-position') || 'null');
    if(saved && UNITS[saved.unit] && UNITS[saved.unit].topics[saved.topic] !== undefined){
      currentUnit = saved.unit;
      currentTopic = saved.topic;
    }
  }catch(e){}
})();

applyTheme(currentTheme);
renderUnitTabs();
renderUnit();
</script>
</body>
