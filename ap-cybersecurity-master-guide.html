<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Cybersecurity — Master Guide</title>
<style>
/* ======================================================================
   DESIGN TOKENS
   Palette: Graphite / Navy Electric / Royal Azure / Powder Blue / Ivory.
   Light mode: Ivory base with Powder Blue panels/borders, Graphite text,
   Royal Azure as the primary accent (headings, key terms, active states).
   Dark mode: Graphite base with Navy-Electric-tinted panels, Ivory/Powder
   Blue text, Royal Azure accent carried through for continuity.
====================================================================== */
:root{
  --bg:            #fbfff1;   /* Ivory */
  --panel:         #eef2e2;   /* Ivory blended toward Powder Blue */
  --panel-raised:  #dee6ec;   /* Powder Blue, lightened */
  --line:          #b4c5e4;   /* Powder Blue */
  --text:          #3c3744;   /* Graphite */
  --text-dim:      #6b6a78;   /* Graphite, lightened for secondary text */
  --accent:        #3d52d5;   /* Royal Azure */
  --accent-dim:    #7c8bd9;   /* Royal Azure, lightened */
  --warn:          #b5842a;
  --risk:          #a13a4a;
  --risk-high-bg:  #f3dde1;
  --risk-mod-bg:   #f1e8d2;
  --risk-low-bg:   #dee6ec;
  --correct-bg:    #dbe7d3;
  --correct-line:  #6f9c5c;
  --wrong-bg:      #f2dde0;
  --wrong-line:    #a13a4a;
  --mono: "SFMono-Regular","Consolas","Liberation Mono",Menlo,monospace;
  --sans: "Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --shadow: 0 1px 2px rgba(9,12,155,.06);
}
:root[data-theme="dark"]{
  --bg:            #201d27;   /* Graphite, darkened */
  --panel:         #2c2836;   /* Graphite/Navy Electric blend */
  --panel-raised:  #36324a;   /* lifted panel, leaning Navy Electric */
  --line:          #4a4560;
  --text:          #fbfff1;   /* Ivory */
  --text-dim:      #b4c5e4;   /* Powder Blue */
  --accent:        #7c8bd9;   /* Royal Azure, lightened for dark bg */
  --accent-dim:    #5a68ad;
  --warn:          #d9ab5c;
  --risk:          #e08a94;
  --risk-high-bg:  #3d2530;
  --risk-mod-bg:   #3a3226;
  --risk-low-bg:   #23304a;
  --correct-bg:    #23301f;
  --correct-line:  #7f9c5c;
  --wrong-bg:      #3d2530;
  --wrong-line:    #c1626e;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}

/* ======================================================================
   BASE / LAYOUT SHELL
   Structure: top unit-tab bar (fixed) -> [ topic sidebar | content pane ]
   This replaces the old iframe-per-unit portal. Everything lives in one
   document so state (theme, scroll, active topic) is simple to manage
   and future units/topics are just data added to UNITS below.
====================================================================== */
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100%}
body{overflow:hidden}

.app{display:flex;flex-direction:column;height:100vh}

/* --- Top bar: brand + unit tabs + theme toggle --- */
.topbar{
  display:flex;align-items:center;gap:14px;
  padding:10px 16px;border-bottom:1px solid var(--line);
  background:var(--bg);flex:0 0 auto;
}
.brand{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);white-space:nowrap}
.brand b{color:var(--accent)}
.unit-tabs{display:flex;gap:6px;flex:1;overflow-x:auto}
.unit-tab{
  border:1px solid var(--line);background:var(--panel);color:var(--text-dim);
  border-radius:7px;padding:8px 14px;cursor:pointer;white-space:nowrap;
  font:600 12px var(--mono);transition:.15s;
}
.unit-tab:hover{border-color:var(--accent);color:var(--text)}
.unit-tab.active{border-color:var(--accent);background:var(--panel-raised);color:var(--accent)}
.theme-btn{
  border:1px solid var(--line);background:var(--panel);color:var(--text-dim);
  border-radius:7px;padding:8px 13px;cursor:pointer;font:600 12px var(--mono);
  white-space:nowrap;transition:.15s;
}
.theme-btn:hover{border-color:var(--accent);color:var(--text)}

/* --- Unit header strip (title / meta) sits above the two-pane body --- */
.unit-header{
  padding:14px 24px;border-bottom:1px solid var(--line);flex:0 0 auto;
}
.unit-crumb{font-family:var(--mono);font-size:11px;color:var(--text-dim)}
.unit-title{font-size:21px;font-weight:800;margin:2px 0 3px}
.unit-meta{font-size:12.5px;color:var(--text-dim)}

/* --- Two-pane body: sidebar (topics) + main (content) --- */
.body-split{flex:1 1 auto;display:flex;min-height:0}

.sidebar{
  width:250px;flex:0 0 auto;border-right:1px solid var(--line);
  overflow-y:auto;padding:14px 10px;
}
.sidebar-label{
  font:600 10px var(--mono);color:var(--text-dim);text-transform:uppercase;
  letter-spacing:.06em;padding:4px 8px 8px;
}
.sidebar-toggle{
  display:none;width:100%;align-items:center;justify-content:space-between;
  background:transparent;border:none;color:var(--text-dim);cursor:pointer;
  padding:6px 8px;font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;
}
.sidebar-toggle .chevron{transition:transform .15s;font-size:13px}
.sidebar[data-collapsed="true"] .sidebar-toggle .chevron{transform:rotate(-90deg)}
.rail-btn{
  display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;
  border:1px solid transparent;background:transparent;color:var(--text-dim);
  border-radius:7px;padding:9px 8px;cursor:pointer;font-size:12.5px;
  line-height:1.4;margin-bottom:2px;transition:.12s;
}
.rail-btn:hover{background:var(--panel)}
.rail-btn.active{background:var(--panel-raised);color:var(--text);border-color:var(--line)}
.rail-btn .n{
  font-family:var(--mono);font-size:10.5px;color:var(--accent);
  flex:0 0 auto;padding-top:1px;
}

.main{flex:1 1 auto;overflow-y:auto;padding:24px 32px 60px}
.main-inner{max-width:880px;margin:0 auto}

/* ======================================================================
   CONTENT COMPONENTS
   One canonical set used by every unit/topic, regardless of which
   ad-hoc class names the original five files used.
====================================================================== */

/* Topic head, shown at the top of each topic's content */
.topic-head{margin-bottom:16px}
.topic-eyebrow{
  font:600 11px var(--mono);color:var(--accent);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:4px;
}
.topic-head h2{font-size:19px;margin:0 0 6px}
.topic-lo{font-size:12.5px;color:var(--text-dim)}

/* Section label — small caps divider between blocks within a topic */
.section-label{
  font:600 10.5px var(--mono);color:var(--text-dim);text-transform:uppercase;
  letter-spacing:.06em;margin:22px 0 8px;padding-top:14px;border-top:1px solid var(--line);
}
.section-label:first-of-type{border-top:none;padding-top:0;margin-top:6px}

/* Generic content card */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:16px 19px;margin-bottom:12px;box-shadow:var(--shadow);
}
.card h3{font-size:14px;margin:0 0 9px}
.card h3::before{
  content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--accent);margin:0 8px 2px 0;
}
.card p{font-size:14px;line-height:1.65;margin:0 0 9px}
.card p:last-child{margin-bottom:0}
.card ul,.card ol{font-size:13.5px;line-height:1.65;margin:8px 0;padding-left:21px}
.card li{margin-bottom:5px}
.card b{color:var(--accent)}

/* Callout — foundational framing box (was "unit-foundation" / ad hoc) */
.callout{
  background:var(--panel-raised);border:1px solid var(--line);border-radius:10px;
  padding:16px 19px;margin:12px 0;font-size:13.5px;line-height:1.6;
}
.callout b{color:var(--accent)}

/* Worked example box */
.example{
  background:var(--panel-raised);border:1px dashed var(--accent-dim);border-radius:10px;
  padding:16px 19px;margin:12px 0;font-size:13.5px;line-height:1.65;
}
.example b{color:var(--accent)}

/* Tables (also covers .compare-table — same base styling, alias for readability in source) */
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font:600 10px var(--mono);color:var(--text-dim);
  text-transform:uppercase;letter-spacing:.03em;padding:7px;
  border-bottom:1px solid var(--line);
}
td{padding:9px 7px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}
tr:last-child td{border-bottom:0}
.term-label,td.label{color:var(--accent);font-weight:600;white-space:nowrap}

/* ACL / firewall-rule tables (Unit 3 style) — allow/deny rows get a tint */
table.acl-table{font-family:var(--mono);font-size:12px}
table.acl-table td.allow{color:var(--correct-line);font-weight:700}
table.acl-table td.deny{color:var(--wrong-line);font-weight:700}

/* Inline code / log-file blocks */
.code{
  display:block;background:var(--panel-raised);border:1px solid var(--line);
  border-radius:8px;padding:12px 14px;margin:10px 0;font-family:var(--mono);
  font-size:12px;line-height:1.6;white-space:pre-wrap;color:var(--text);
}

/* Attack-chain / process flow line */
.flow{
  font-size:13.5px;background:var(--panel-raised);border:1px solid var(--line);
  border-radius:8px;padding:11px 14px;margin:10px 0;line-height:1.6;
}

/* Fine-print clarifying note under a table or figure */
.matrix-note{font-size:12.5px;color:var(--text-dim);line-height:1.6;margin-top:8px}

/* Worked-example sub-label ("Worked example:", "Scenario:") */
.step{color:var(--accent)}
.walkthrough{line-height:1.65}

/* Reasoning-framework grid (e.g. ASSET / VULNERABILITY / THREAT / IMPACT) */
.grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;font-size:13px;line-height:1.55;
}
.grid > div{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 13px;
}
.grid > div b{
  display:block;font:700 10.5px var(--mono);color:var(--accent);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;
}
@media(max-width:600px){ .grid{grid-template-columns:1fr} }

/* Risk badges */
.risk-badge{
  display:inline-block;font:600 10.5px var(--mono);text-transform:uppercase;
  letter-spacing:.03em;padding:2px 8px;border-radius:5px;margin-right:6px;
}
.risk-badge.high{background:var(--risk-high-bg);color:var(--risk)}
.risk-badge.mod{background:var(--risk-mod-bg);color:var(--warn)}
.risk-badge.low{background:var(--risk-low-bg);color:var(--text-dim)}

/* Glossary — standalone "must-know terms" component.
   Present in every topic now (units 4/5 previously only had inline
   .term labels inside tables; this gives them the same component
   units 1/3 had, ready for you to populate later). */
.glossary{display:grid;grid-template-columns:1fr;gap:0}
.gterm{padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.55}
.gterm:last-child{border-bottom:none}
.gterm b{color:var(--text);font-weight:650}
.gterm .def{color:var(--text-dim)}
.ekid{font-family:var(--mono);font-size:10px;color:var(--text-dim);opacity:.7;margin-left:6px;font-weight:400}
.card h3 .ekid{vertical-align:middle}

/* Quiz block — "Check your understanding". Present in every topic now.
   If a topic has no authored questions yet, a placeholder state renders
   instead (see JS) so the layout stays consistent while content is
   filled in incrementally. */
.quiz-block{
  background:var(--panel-raised);border:1px solid var(--line);border-radius:10px;
  padding:16px 19px;margin:14px 0;
}
.quiz-block .q{margin-bottom:18px}
.quiz-block .q:last-child{margin-bottom:0}
.quiz-stem{font-size:13.5px;font-weight:600;margin-bottom:8px;line-height:1.5}
.quiz-opts{display:flex;flex-direction:column;gap:6px}
.quiz-opt{
  display:block;width:100%;text-align:left;border:1px solid var(--line);
  background:var(--panel);color:var(--text);border-radius:7px;
  padding:9px 12px;cursor:pointer;font-size:13px;font-family:var(--sans);
  transition:.12s;
}
.quiz-opt:hover:not(:disabled){border-color:var(--accent)}
.quiz-opt:disabled{cursor:default}
.quiz-opt.correct{background:var(--correct-bg);border-color:var(--correct-line)}
.quiz-opt.wrong{background:var(--wrong-bg);border-color:var(--wrong-line)}
.quiz-explain{
  display:none;margin-top:8px;font-size:12.5px;color:var(--text-dim);
  line-height:1.55;padding:8px 10px;border-left:2px solid var(--accent-dim);
}
.quiz-explain.show{display:block}
.quiz-placeholder{
  font-size:12.5px;color:var(--text-dim);font-style:italic;
  border:1px dashed var(--line);border-radius:8px;padding:14px 16px;
}

/* Prev/next topic footer */
.nav-foot{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
}
.nav-foot button{
  border:1px solid var(--line);background:var(--panel);color:var(--text);
  border-radius:7px;padding:8px 14px;cursor:pointer;font:600 12px var(--mono);
}
.nav-foot button:disabled{opacity:.4;cursor:default}
.nav-foot button:not(:disabled):hover{border-color:var(--accent)}
.nav-foot .pos{font-size:12px;color:var(--text-dim);font-family:var(--mono)}

/* Topic visibility — only the active topic renders */
.topic{display:none}
.topic.active{display:block}

/* ======================================================================
   RESPONSIVE
====================================================================== */
@media(max-width:860px){
  .topbar{flex-wrap:wrap;height:auto;row-gap:8px}
  .unit-tabs{flex:1 1 100%;order:3;overflow-x:auto}
  .brand{flex:1 1 auto}
  .theme-btn{flex:0 0 auto}
  .body-split{flex-direction:column}
  .sidebar{
    width:100%;border-right:none;border-bottom:1px solid var(--line);
    max-height:none;
  }
  .sidebar[data-collapsed="true"] .rail-list{display:none}
  .sidebar-toggle{display:flex}
  .main{padding:18px 16px 40px}
}
@media(min-width:861px){
  .sidebar-toggle{display:none}
}
</style>
</head>
<body>
<div class="app">

  <!-- ============ TOP BAR: brand + unit tabs + theme toggle ============ -->
  <nav class="topbar" aria-label="AP Cybersecurity units">
    <div class="brand"><b>AP-CYBERSECURITY</b> / MASTER GUIDE</div>
    <div class="unit-tabs" id="unitTabs"></div>
    <button class="theme-btn" id="themeToggle" type="button">🌙 Dark Mode</button>
  </nav>

  <!-- ============ UNIT HEADER: title + meta for the active unit ============ -->
  <div class="unit-header">
    <div class="unit-crumb" id="unitCrumb"></div>
    <div class="unit-title" id="unitTitle"></div>
    <div class="unit-meta" id="unitMeta"></div>
  </div>

  <!-- ============ BODY: topic sidebar + content pane ============ -->
  <div class="body-split">
    <aside class="sidebar" id="sidebar" aria-label="Topics in this unit">
      <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-expanded="true">
        <span class="sidebar-label" style="padding:0">Topics</span>
        <span class="chevron">▾</span>
      </button>
      <div class="rail-list" id="topicRail"></div>
    </aside>

    <main class="main">
      <div class="main-inner" id="topicsContainer"></div>
    </main>
  </div>

</div>

<script>
/* ======================================================================
   DATA MODEL
   Canonical shape every unit is authored/migrated into. To add content
   later: find the right unit's `topics` array below and either edit an
   existing topic object or push a new one — nothing else needs to change.

   UNITS = [
     {
       id: 1, slug: "introduction-to-security", title: "Introduction to Security",
       meta: "~10 class periods · Skills emphasized: Analyze Risk · Mitigate Risk · Detect Attacks",
       foundation: { eyebrow: "Unit Foundation", title: "...", html: "<p>...</p>" },  // optional
       topics: [
         {
           id: "1.1", title: "Social Engineering", lo: "1.1.A ... · 1.1.B ...",
           html: `...card/callout/table markup using the classes above...`,
           glossary: [ {term:"Elicitation", def:"..."} , ... ],   // optional, renders .glossary
           quiz: [ {q:"...", opts:["...","...","...","..."], correct:1, explain:"..."} ]  // optional
         },
         ...
       ]
     },
     ... units 2-5
   ];

   This shape is the single canonical format every unit will be migrated
   into during Parts 2-3, so adding new topics/questions later is just
   appending objects to a unit's `topics` array or a topic's `quiz` array.
====================================================================== */

const UNITS = [{"id": 1, "slug": "introduction-to-security", "title": "Unit 1 \u2014 Introduction to Security", "meta": "~10 class periods \u00b7 Skills emphasized: Analyze Risk \u00b7 Mitigate Risk \u00b7 Detect Attacks", "topics": [{"id": "1.1", "title": "Understanding Social Engineering", "lo": "1.1.A Identify indicators of social engineering &middot; 1.1.B Explain how tactics influence victims &middot; 1.1.C Describe possible impacts", "quiz": [{"q": "An email tells an employee: 'Your account will be permanently deleted in 2 hours unless you verify your password using the link below.' Which social engineering tactic is primarily demonstrated by the phrase 'in 2 hours'?", "opts": ["Familiarity", "Urgency", "Consensus", "Authority"], "correct": 1, "explain": "The 2-hour deadline is designed to make the target act fast, before they can stop and evaluate whether the email is legitimate \u2014 that's urgency. The threat of deletion itself is intimidation; the '2 hours' specifically is the urgency component."}, {"q": "Why is a stolen one-time password (OTP) particularly dangerous compared to a stolen static password alone?", "opts": ["OTPs are always longer and take more processing power to store", "An OTP can let an adversary bypass multifactor authentication entirely", "OTPs are stored in plaintext on all servers", "OTPs never expire, so they can be reused indefinitely"], "correct": 1, "explain": "OTPs are meant to be the 'something you have' factor in MFA. If a victim is tricked into handing one over, the adversary can complete the MFA challenge as if they were the legitimate user \u2014 defeating the whole purpose of the second factor."}, {"q": "A victim gives an adversary their pet's name, birthdate, and mother's maiden name in response to a 'survey.' No link was clicked and no file was downloaded. What is the most direct risk created by this specific exchange?", "opts": ["Malware installation on the victim's device", "The adversary can use this info to answer identity-challenge questions and impersonate the victim elsewhere", "A denial-of-service attack against the victim's home network", "The victim's device firmware will be corrupted"], "correct": 1, "explain": "Per EK 1.1.C.1, this type of personal information is commonly used as challenge-question answers on other services \u2014 the direct risk here is impersonation, not malware (since nothing was clicked/downloaded)."}], "html": "\n    <div class=\"section-label\">Core content</div>\n\n    <div class=\"card\">\n      <h3>What social engineering is <span class=\"ekid\">1.1.A.1</span></h3>\n      <p>Social engineering attacks employ <b>psychological tactics</b> to manipulate a user into doing one of three things: revealing sensitive information (this specific act is called <b>elicitation</b>), downloading a malicious file, or clicking a malicious link. It can happen face-to-face, but it's most commonly delivered by email, text message, or social media message. The defining feature is that the \"vulnerability\" being exploited is a human being's judgment, not a piece of software.</p>\n    </div>\n\n    <div class=\"card\">\n      <h3>The two tactics named explicitly in the framework <span class=\"ekid\">1.1.A.2, 1.1.B.1\u2013B.3</span></h3>\n      <p>Adversaries rely on common psychological principles that influence behavior. Two specific ones are tested repeatedly:</p>\n      <table class=\"compare-table\">\n        <tr><th>Tactic</th><th>Definition</th><th>Why it works</th></tr>\n        <tr>\n          <td class=\"label\">Intimidation</td>\n          <td>Adversary threatens the target with negative consequences if they don't comply.</td>\n          <td>Leverages a natural human aversion to negative consequences \u2014 fear pushes people to act.</td>\n        </tr>\n        <tr>\n          <td class=\"label\">Urgency</td>\n          <td>Adversary manufactures a reason the target must act quickly.</td>\n          <td>Leverages the natural response to react fast to time-sensitive needs \u2014 it prevents the target from pausing to evaluate whether the action is reasonable or safe.</td>\n        </tr>\n      </table>\n      <div class=\"callout\"><b>Why this distinction matters on the exam:</b> questions will give you an actual message and ask you to identify the exact phrase that demonstrates the tactic. \"Suspend\" / \"delete\" / \"lose access\" language = intimidation (consequence-focused). \"Within 24 hours\" / \"today only\" / \"your student won't be able to...\" = urgency (time-focused). A message can use both at once \u2014 be ready to identify each separately.</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>What victims lose, and why each type of loss matters <span class=\"ekid\">1.1.C.1\u2013C.3</span></h3>\n      <ul>\n        <li><b>Personal information</b> (name, phone number, address, workplace, pets' names, birthdate) \u2014 this is dangerous specifically because this same information is frequently used by <i>other</i> websites as security-challenge questions (\"what was your first pet's name?\"). Losing it to one attacker can compromise identity verification everywhere else.</li>\n        <li><b>Secure information</b> like a one-time password (OTP) or an authentication login code \u2014 this is more severe than a stolen static password because it can let an adversary complete a login <i>as</i> the victim even when MFA is in place, since the victim handed over the second factor directly.</li>\n        <li><b>Malware / credential capture via a link or file</b> \u2014 a victim may download malware or click a link that installs malware, steals data from the browser, or redirects them to a fake site designed to capture login credentials.</li>\n      </ul>\n    </div>\n\n    <div class=\"card\">\n      <h3>Recognizing a social-engineering message</h3>\n      <p>Read the message as a chain of <b>evidence \u2192 tactic \u2192 requested action \u2192 possible impact</b>. For example, \u201cYour account will be deleted unless you verify immediately\u201d contains intimidation (\u201cwill be deleted\u201d), urgency (\u201cimmediately\u201d), and a requested action (\u201cverify\u201d). A malicious link or request for an OTP then tells you what the attacker is trying to obtain.</p>\n      <p>Social engineering does <b>not</b> require malware. An attacker can succeed simply by persuading a person to reveal information or perform an action.</p>\n    </div>\n\n    <div class=\"section-label\">Must-know terms</div>\n    <div class=\"card\">\n      <div class=\"glossary\">\n        <div class=\"gterm\"><b>Elicitation \u2014</b> <span class=\"def\">the act of manipulating a target into revealing sensitive information through conversation or messaging, rather than through a technical exploit.</span></div>\n        <div class=\"gterm\"><b>Social engineering \u2014</b> <span class=\"def\">any attack that manipulates human psychology (rather than software/hardware flaws) to achieve a malicious outcome.</span></div>\n        <div class=\"gterm\"><b>Intimidation \u2014</b> <span class=\"def\">threatening negative consequences for non-compliance.</span></div>\n        <div class=\"gterm\"><b>Urgency \u2014</b> <span class=\"def\">manufacturing time pressure to short-circuit careful evaluation.</span></div>\n      </div>\n    </div>\n\n    <div class=\"example walkthrough\">\n      <b class=\"step\">Worked example (matches the style of Scenario 1A / sample MCQ 8\u201310):</b><br><br>\n      An email claims to be from HR: <i>\"Failure to respond by end of day may result in suspension of payroll access... Over 92% of employees have already completed this verification.\"</i><br><br>\n      <b>Intimidation</b>: \"may result in suspension of payroll access\" \u2014 a threatened negative consequence.<br>\n      <b>Urgency</b>: \"by end of day\" \u2014 a manufactured deadline.<br>\n      <b>Consensus</b> (a related tactic covered more fully in Unit 2, but shows up here too): \"Over 92% of employees have already completed this\" \u2014 social pressure implying everyone else has already complied.<br><br>\n      If asked \"what happens if the recipient replies with the requested personal info (phone, pet's name, birthdate)?\" \u2014 the correct answer is about <b>impersonation risk</b>, because those are exactly the fields used as identity-challenge answers elsewhere (EK 1.1.C.1) \u2014 not device compromise, since no link or file was involved in that specific request.\n    </div>\n  ", "glossary": []}, {"id": "1.2", "title": "Suspicious Website Logins", "lo": "1.2.A Identify signs of a password attack &middot; 1.2.B Explain how weak authentication is exploited &middot; 1.2.C Explain how to strengthen authentication", "quiz": [{"q": "A security log shows 40 failed login attempts on one account within 90 seconds, all from the same IP address, followed by one success. What does this most likely indicate?", "opts": ["A stateful firewall misconfiguration", "An online password attack (e.g. brute force / dictionary)", "A DNS poisoning attack", "Normal user behavior after a forgotten password"], "correct": 1, "explain": "Rapid, repeated failed logins from one source followed by eventual success is the classic signature of an automated online password attack \u2014 a person fat-fingering their password a few times looks nothing like this volume/speed."}, {"q": "Which password practice creates the LEAST resistance to a dictionary-based password attack?", "opts": ["Using a randomly generated 16-character password from a password manager", "Using a long passphrase of unrelated words", "Using a pet's name followed by a two-digit birth year", "Enabling MFA in addition to a strong password"], "correct": 2, "explain": "Pet names and birth years are exactly the kind of personally meaningful, OSINT-derivable content adversaries build their password dictionaries from (EK 1.2.B.2)."}, {"q": "An online password attack differs from an offline password attack (studied later in the course) primarily because:", "opts": ["Online attacks only work against Wi-Fi networks", "Online attacks are attempted directly against a live authentication portal in real time, rather than against a stolen password database on the adversary's own machine", "Online attacks never generate any log evidence", "Online attacks require physical access to the target device"], "correct": 1, "explain": "Per EK 1.2.A.1, an online password attack is defined by attempting logins against the live, active service \u2014 this is what makes it detectable in real-time logs, unlike an offline attack against a stolen database."}], "html": "\n    <div class=\"section-label\">Core content</div>\n\n    <div class=\"card\">\n      <h3>What an online password attack is <span class=\"ekid\">1.2.A.1</span></h3>\n      <p>In an <b>online password attack</b>, an adversary tries logging into a live device or service using common passwords, common password patterns, or previously stolen passwords \u2014 against the actual login portal, in real time (this distinguishes it from an <i>offline</i> attack, covered later in Unit 4, where a stolen password database is cracked on the adversary's own machine).</p>\n    </div>\n\n    <div class=\"card\">\n      <h3>Reading the signs in a log <span class=\"ekid\">1.2.A.2</span></h3>\n      <ul>\n        <li>Many failed login attempts over a short duration</li>\n        <li>Login attempts at unusual times (e.g., 3 a.m. for an account that's normally used 9\u20135)</li>\n        <li>Login attempts from unknown/unfamiliar devices</li>\n      </ul>\n      <div class=\"callout\"><b>Exam pattern:</b> free-response questions will hand you an authentication log and ask you to point to <i>specific rows</i> as evidence \u2014 not just describe the pattern in the abstract. Practice citing exact timestamps/entries when you make this claim.</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>How weak authentication gets exploited <span class=\"ekid\">1.2.B.1\u2013B.2</span></h3>\n      <p>People build passwords from predictable patterns:</p>\n      <ul>\n        <li>A word or two + a two-digit number (often a year) + a special character at the end</li>\n        <li>Names of family members or pets</li>\n        <li>Personally significant dates</li>\n      </ul>\n      <p>Adversaries exploit this by building a <b>dictionary</b> of likely passwords from personal information gathered about the target (birthday, anniversary, pet/family names \u2014 often via OSINT or social media), then run that dictionary against the login automatically with a tool.</p>\n    </div>\n\n    <div class=\"card\">\n      <h3>What authentication is</h3>\n      <p><b>Authentication</b> is the process of verifying that a person or system is the identity it claims to be. A password is one authentication factor: something the user knows. MFA requires more than one type of proof of identity.</p>\n      <div class=\"example\"><b>Important connection to 1.1:</b> stealing a password is dangerous, but persuading a victim to reveal an OTP or authentication code can let an adversary complete the second factor as well. MFA is a strong control, but it does not protect a user who is tricked into handing the second factor directly to the attacker.</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>Making authentication stronger <span class=\"ekid\">1.2.C.1\u2013C.3</span></h3>\n      <ul>\n        <li><b>Long, random, unique</b> passwords \u2014 best generated and stored by a <b>password manager</b>, or a long, unique passphrase created by the user.</li>\n        <li>Avoid names, dates, or other personally meaningful words/numbers when constructing a password.</li>\n        <li>Enable <b>multifactor authentication (MFA)</b> wherever available \u2014 requires an extra proof of identity (like a one-time code) in addition to the password.</li>\n      </ul>\n    </div>\n\n    <div class=\"section-label\">Must-know terms</div>\n    <div class=\"card\">\n      <div class=\"glossary\">\n        <div class=\"gterm\"><b>Online password attack \u2014</b> <span class=\"def\">real-time login attempts against a live authentication portal.</span></div>\n        <div class=\"gterm\"><b>Dictionary (in this context) \u2014</b> <span class=\"def\">a curated list of likely passwords built from personal info about the specific target, as opposed to a generic wordlist.</span></div>\n        <div class=\"gterm\"><b>Password manager \u2014</b> <span class=\"def\">a tool that generates and securely stores long, random, unique passwords so the user doesn't have to remember or reuse them.</span></div>\n        <div class=\"gterm\"><b>MFA (multifactor authentication) \u2014</b> <span class=\"def\">requiring more than one type of proof of identity \u2014 e.g., a password plus a one-time code.</span></div>\n      </div>\n    </div>\n\n    <div class=\"example walkthrough\">\n      <b class=\"step\">Worked example (matches Scenario 1B / sample MCQ style):</b><br><br>\n      A gaming account's login log shows entries mostly on weekends/evenings from IP 208.104.29.211 \u2014 the user's normal device \u2014 but two entries mid-week during school hours from a different IP, 142.54.195.17.<br><br>\n      <b>What's suspicious:</b> logins at unusual times (mid-week, school hours, when the account owner says they don't use it then) from an unfamiliar device/IP \u2014 both signs from EK 1.2.A.2 present at once.<br><br>\n      <b>What this does NOT tell you:</b> the log alone doesn't prove <i>how</i> the password was obtained (phishing? weak password guessed? credential reuse from a breach elsewhere?) \u2014 don't overstate the conclusion beyond what the log evidence supports.\n    </div>\n  ", "glossary": []}, {"id": "1.3", "title": "Best Practices for Public Networks", "lo": "1.3.A Identify adversary type &middot; 1.3.B Identify wireless attack types &middot; 1.3.C Describe individual protections", "quiz": [{"q": "At a conference center, attendees report they cannot connect to any wireless network at all, even ones that worked fine an hour earlier, anywhere in the building. What is most likely happening?", "opts": ["Evil twin attack", "War driving", "Jamming attack", "Credential stuffing"], "correct": 2, "explain": "Total inability to connect anywhere in the space, affecting all networks, is the signature of a jamming attack flooding the frequency range with noise \u2014 a denial of service against the wireless medium itself."}, {"q": "An adversary can craft new, previously undocumented exploits rather than relying on tools built by others. This adversary's capability is best described using the term:", "opts": ["Zero-day", "Evil twin", "Password spray", "Managerial control gap"], "correct": 0, "explain": "The ability to discover and exploit undocumented vulnerabilities is the definition of a zero-day \u2014 and per the framework, that capability marks a high-skilled adversary."}, {"q": "A user connects to a VPN while on public Wi-Fi at an airport. Which statement about this VPN use is accurate?", "opts": ["The airport's network provider can no longer see any of the user's traffic, and neither can the VPN provider", "The airport's network provider cannot see the encrypted traffic, but the VPN provider can still view it", "A VPN encrypts traffic only for websites that don't already use HTTPS", "A VPN prevents evil twin attacks from being able to intercept any traffic at all, encrypted or not"], "correct": 1, "explain": "Per EK 1.3.C.3, a VPN hides traffic from the local service provider, but the VPN operator itself can still see the traffic \u2014 it's a shift of trust, not an elimination of trust."}, {"q": "An adversary spends several days walking around a corporate campus with a laptop, simply recording which Wi-Fi networks are broadcasting and where their signals extend outside the building, without connecting to or disrupting anything. This activity is best described as:", "opts": ["Jamming", "War driving", "An evil twin attack", "A denial of service attack"], "correct": 1, "explain": "Detecting and mapping wireless beacons without disrupting service or capturing traffic is war driving \u2014 pure reconnaissance, often done to plan a later attack."}], "html": "\n    <div class=\"section-label\">Core content</div>\n\n    <div class=\"card\">\n      <h3>Classifying adversaries by skill <span class=\"ekid\">1.3.A.1</span></h3>\n      <ul>\n        <li><b>Low-skilled adversaries</b> rely on malicious tools created by others, which can be purchased online. These tools exploit <i>known</i> vulnerabilities.</li>\n        <li><b>High-skilled adversaries</b> can create new malicious tools or modify existing ones to adapt to new defenses, and can discover undocumented vulnerabilities \u2014 called <b>zero days</b>.</li>\n      </ul>\n    </div>\n\n    <div class=\"card\">\n      <h3>Adversary motivations <span class=\"ekid\">1.3.A.2</span></h3>\n      <p>Greed, desire for recognition, dedication to a cause, revenge, politics, or beliefs. (Unit 2 expands this into named adversary categories \u2014 script kiddie, hacktivist, insider, cyberterrorist, transnational criminal organization \u2014 but for Unit 1 you only need skill level + general motivation.)</p>\n    </div>\n\n    <div class=\"card\">\n      <h3>The three wireless attacks \u2014 know them cold <span class=\"ekid\">1.3.B.1\u2013B.3</span></h3>\n      <table class=\"compare-table\">\n        <tr><th>Attack</th><th>Mechanism</th><th>Tell-tale sign</th></tr>\n        <tr>\n          <td class=\"label\">Evil twin</td>\n          <td>Adversary sets up their own wireless access point (WAP) with a service set identifier (SSID) identical or similar to a legitimate target network. Victims unknowingly connect to the fake one, letting the adversary capture traffic. The adversary <b>cannot</b> read traffic that uses an encrypted protocol like HTTPS.</td>\n          <td>Two networks with the same/near-identical name appear; user connected to the wrong one and got logged out of services or saw odd behavior afterward.</td>\n        </tr>\n        <tr>\n          <td class=\"label\">Jamming</td>\n          <td>Adversary floods the area with a strong electromagnetic (EM) signal on the same frequency as the wireless network, preventing legitimate traffic between the access point and users. This is a specific example of a <b>denial of service (DoS)</b> attack \u2014 one that prevents users from accessing resources.</td>\n          <td>No wireless devices anywhere in the physical space can connect to any network \u2014 total, area-wide disruption, not just one network being spoofed.</td>\n        </tr>\n        <tr>\n          <td class=\"label\">War driving</td>\n          <td>Adversary drives or walks around a target detecting wireless network beacons \u2014 this is <i>reconnaissance</i>, not disruption. If a signal is detected, the adversary learns the type of wireless network used and finds where the signal leaks outside the physical building.</td>\n          <td>No impact on availability \u2014 this is information-gathering about what networks exist and where they can be reached from, often as prep for a later attack (e.g., an evil twin placed where the signal leaks outside).</td>\n        </tr>\n      </table>\n      <div class=\"callout\"><b>Common exam trap:</b> jamming and evil twin are both wireless attacks but solve completely different adversary goals \u2014 jamming denies availability to everyone; evil twin steals data from people who connect to the fake network. If the question says \"nobody can connect to anything,\" that rules out evil twin (which requires people to actually connect to the rogue AP).</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>Individual protections on public/untrusted networks <span class=\"ekid\">1.3.C.1\u2013C.3</span></h3>\n      <ul>\n        <li><b>Verify the exact network name</b> before connecting \u2014 the name of the wireless network should exactly match the intended network's name. This reduces the likelihood of accidentally connecting to an evil twin; it does not by itself prove that a network is trustworthy.</li>\n        <li>Most internet protocols are encrypted by default, but individuals should consider the sensitivity of their data before joining <b>unencrypted</b> Wi-Fi, since some traffic (e.g., DNS queries) may remain exposed even when other traffic is protected.</li>\n        <li>A <b>VPN (virtual private network)</b> encrypts all traffic between the device and the VPN operator's system. This <i>prevents the local service provider</i> (e.g., the coffee shop's network) from viewing the traffic \u2014 but the VPN provider itself <i>can</i> still see it. A VPN does not make you anonymous to your VPN provider.</li>\n      </ul>\n    </div>\n\n    <div class=\"card\">\n      <h3>Three different layers of network protection</h3>\n      <table class=\"compare-table\">\n        <tr><th>Protection</th><th>What it protects</th><th>Who can still potentially observe the traffic?</th></tr>\n        <tr><td class=\"label\">Unencrypted Wi-Fi</td><td>The wireless link itself provides little or no confidentiality.</td><td>Others able to observe the local wireless traffic may see unprotected information.</td></tr>\n        <tr><td class=\"label\">HTTPS</td><td>Encrypts the communication between a browser/app and the website or service using HTTPS.</td><td>The local network generally cannot read the protected web content, though some metadata such as DNS information may still be exposed depending on the setup.</td></tr>\n        <tr><td class=\"label\">VPN</td><td>Encrypts traffic between the device and the VPN provider's system.</td><td>The local network is prevented from viewing the encrypted traffic, but the VPN provider becomes a trusted intermediary.</td></tr>\n      </table>\n    </div>\n\n    <div class=\"section-label\">Must-know terms</div>\n    <div class=\"card\">\n      <div class=\"glossary\">\n        <div class=\"gterm\"><b>Zero-day \u2014</b> <span class=\"def\">an undocumented vulnerability, unknown to the vendor/defenders, that a high-skilled adversary can discover and exploit before a patch exists.</span></div>\n        <div class=\"gterm\"><b>SSID \u2014</b> <span class=\"def\">the human-readable name of a wireless network (what you pick from the Wi-Fi list).</span></div>\n        <div class=\"gterm\"><b>WAP (wireless access point) \u2014</b> <span class=\"def\">the hardware device that broadcasts a wireless network and lets devices join it.</span></div>\n        <div class=\"gterm\"><b>DoS (denial of service) \u2014</b> <span class=\"def\">any attack whose goal is to make a resource unavailable to legitimate users \u2014 jamming is one example.</span></div>\n        <div class=\"gterm\"><b>VPN \u2014</b> <span class=\"def\">encrypts traffic between a device and the VPN provider's servers, hiding it from the local network but not from the VPN provider.</span></div>\n      </div>\n    </div>\n\n    <div class=\"example walkthrough\">\n      <b class=\"step\">Worked example (matches Scenario 1C):</b><br><br>\n      A user sees a sign: \"Login to our free Wi-Fi: Sunshine Coffee Wi-Fi\" but actually joins a network called \"Guest Wi-Fi\" \u2014 set up by an adversary \u2014 is redirected to a fake captive portal, and enters credentials for a platform used to log into other services. The adversary then uses those stolen credentials to access the victim's linked accounts.<br><br>\n      <b>Attack type:</b> Evil twin (fake WAP with a plausible-but-wrong name) combined with <b>credential harvesting</b> at the fake portal (a term formally introduced in Unit 3, but the mechanism \u2014 a fake login page capturing real credentials \u2014 appears here in the Unit 1 scenario).<br><br>\n      <b>Prevention:</b> verify the exact SSID before connecting (EK 1.3.C.1) \u2014 \"Guest Wi-Fi\" \u2260 \"Sunshine Coffee Wi-Fi,\" and that mismatch was the actual tell.<br><br>\n      <b>Trade-off to discuss:</b> using one platform to log into many services is convenient, but it means one compromised credential unlocks everything linked to it \u2014 a single point of failure.\n    </div>\n  ", "glossary": []}, {"id": "1.4", "title": "AI-Based Cybersecurity Attacks", "lo": "1.4.A Explain how adversaries use AI to augment attacks &middot; 1.4.B Explain how to protect against them", "quiz": [{"q": "A grandparent receives a call that sounds exactly like their grandchild, panicked and asking for emergency money. The grandchild never made the call. Which defense from the framework would have most directly defeated this specific attack?", "opts": ["A longer Wi-Fi password", "A pre-established shared secret phrase used to verify identity", "A stronger firewall rule on the home router", "Antivirus software on the grandparent's phone"], "correct": 1, "explain": "This is a voice-cloning social engineering attack. None of the network/device controls address it \u2014 the framework's specific countermeasure is a shared secret only the two real parties know."}, {"q": "Which of the following is an example of adversaries poisoning AI training data, as described in the framework?", "opts": ["Using a chatbot to write phishing emails in fluent French", "Publishing false information on websites so it gets scraped into a future LLM's training set", "Cloning a CEO's voice from an earnings-call recording", "Using an AI tool to scan for open ports on a target network"], "correct": 1, "explain": "Publishing false info specifically to influence what gets absorbed into training data is the training-data-poisoning tactic \u2014 distinct from just using AI as a writing or recon tool."}, {"q": "An employee pastes a confidential internal memo into a public AI chatbot to ask for help summarizing it. According to the framework, what is the specific risk being described?", "opts": ["The chatbot will immediately publish the memo publicly", "Some AI tools feed user input back into the model for continuous training, so an adversary could later extract the sensitive content from the model", "The chatbot will automatically alert the employee's IT department", "This action always violates copyright law"], "correct": 1, "explain": "EK 1.4.B.3 specifically warns that some AI tools train on user input, meaning sensitive data entered into a prompt could later be extracted by someone else through prompt-based extraction."}], "html": "\n    <div class=\"section-label\">Core content</div>\n\n    <div class=\"card\">\n      <h3>Six distinct ways adversaries weaponize AI <span class=\"ekid\">1.4.A.1\u2013A.6</span></h3>\n      <ul>\n        <li><b>Voice/image cloning for impersonation (1.4.A.1)</b> \u2014 AI tools can build a digital avatar of a real person from existing voice/image samples, letting an adversary impersonate them over a phone or even video call. This risk grows as more organizations adopt voice-based authentication.</li>\n        <li><b>Fluent, native-sounding phishing in any language (1.4.A.2)</b> \u2014 LLMs let adversaries generate convincing phishing messages in any target language. Traditional phishing was sometimes detectable because non-native speakers wrote it, producing unnatural language \u2014 AI removes that tell.</li>\n        <li><b>Prompt-based data extraction (1.4.A.3)</b> \u2014 adversaries can craft prompts that extract secure or sensitive information from LLMs. That sensitive info can originate from user input the model was fed, or from the data the model was trained on.</li>\n        <li><b>Training-data poisoning (1.4.A.4)</b> \u2014 adversaries publish new websites or modify existing ones to contain false information, hoping that content gets scraped into a future LLM's training set \u2014 causing the model to later repeat the false information as if true.</li>\n        <li><b>AI-powered reconnaissance (1.4.A.5)</b> \u2014 tools that scan the internet to gather information posted on social media and public websites about a target, automating what used to be manual OSINT collection.</li>\n        <li><b>AI-assisted malicious coding (1.4.A.6)</b> \u2014 AI-enhanced coding tools can help adversaries write new malware, modify existing application code to behave maliciously, or find vulnerabilities in large codebases faster than manual review would allow.</li>\n      </ul>\n    </div>\n\n    <div class=\"card\">\n      <h3>What AI adds to an existing attack</h3>\n      <p>AI does not necessarily create an entirely new category of attack. It can <b>augment</b> familiar attacks by making them faster, more convincing, more scalable, or easier to perform.</p>\n      <table class=\"compare-table\">\n        <tr><th>Attack</th><th>What AI adds</th><th>Potential result</th></tr>\n        <tr><td class=\"label\">Phishing</td><td>Fluent, convincing messages in many languages.</td><td>Fewer obvious language errors and more believable lures.</td></tr>\n        <tr><td class=\"label\">Reconnaissance</td><td>Rapid collection and analysis of public information.</td><td>Faster, larger-scale target profiling.</td></tr>\n        <tr><td class=\"label\">Malicious coding</td><td>Faster code generation, modification, and vulnerability discovery.</td><td>More efficient development or adaptation of malicious software.</td></tr>\n        <tr><td class=\"label\">Impersonation</td><td>Synthetic voice or image generation.</td><td>More convincing impersonation of trusted people.</td></tr>\n      </table>\n    </div>\n\n    <div class=\"card\">\n      <h3>Four defenses specifically for AI-augmented attacks <span class=\"ekid\">1.4.B.1\u2013B.4</span></h3>\n      <ul>\n        <li><b>Shared secrets (1.4.B.1)</b> \u2014 establish a secret word or phrase known only to close friends/relatives, used to verify identity in high-stakes situations. This directly defeats voice-cloning scams because the clone doesn't know the secret.</li>\n        <li><b>MFA (1.4.B.2)</b> \u2014 if an adversary clones a target's voice to try to access a voice-authenticated system, requiring a second factor can still block access, since the clone alone doesn't satisfy MFA.</li>\n        <li><b>Don't feed personal/sensitive data into AI tools (1.4.B.3)</b> \u2014 some AI chatbots/assistants feed user input back into the model for continuous training; adversaries could later extract data that users included in their own prompts.</li>\n        <li><b>Verify AI output independently (1.4.B.4)</b> \u2014 carefully evaluate output from AI tools, checking it against reputable, stable, non-AI-based sources before trusting or acting on it.</li>\n      </ul>\n    </div>\n\n    <div class=\"callout\"><b>Exam pattern:</b> a question will describe an AI-augmented attack scenario (often voice cloning, matching Scenario 1D) and ask which specific defense from 1.4.B would have helped. Match the defense to the exact mechanism of the attack \u2014 MFA stops an authentication bypass, but a shared secret is what stops someone from being fooled on an unauthenticated phone call in the first place.</div>\n\n    <div class=\"section-label\">Must-know terms</div>\n    <div class=\"card\">\n      <div class=\"glossary\">\n        <div class=\"gterm\"><b>Voice cloning \u2014</b> <span class=\"def\">using AI trained on voice samples to synthetically reproduce a target's voice for impersonation.</span></div>\n        <div class=\"gterm\"><b>Training-data poisoning \u2014</b> <span class=\"def\">deliberately publishing false content so it gets absorbed into a future AI model's training data.</span></div>\n        <div class=\"gterm\"><b>Prompt extraction \u2014</b> <span class=\"def\">crafting input designed to trick an AI model into revealing sensitive data from its training set or from other users' input.</span></div>\n        <div class=\"gterm\"><b>Shared secret \u2014</b> <span class=\"def\">a private word/phrase known only to two trusted parties, used as an out-of-band identity check.</span></div>\n      </div>\n    </div>\n\n    <div class=\"example walkthrough\">\n      <b class=\"step\">Worked example (matches Scenario 1D \u2014 AI-Powered Cyberattacks):</b><br><br>\n      An adversary scrapes short videos a target posted on social media to gather voice samples, feeds them into a voice-cloning tool, then calls the target's relative claiming to be the target and in urgent trouble, requesting bail money.<br><br>\n      <b>Attack chain:</b> social-media reconnaissance (gathering samples) \u2192 AI voice cloning (impersonation tool) \u2192 social engineering (urgency + impersonation of a trusted person) used together.<br><br>\n      <b>Best defense discussed in the framework:</b> a pre-established shared secret phrase between family members, since it defeats the impersonation directly regardless of how convincing the cloned voice sounds.\n    </div>\n  ", "glossary": []}, {"id": "1.5", "title": "Leveraging AI in Cyber Defense", "lo": "1.5.A Explain how defenders use AI to protect networks/apps/data &middot; 1.5.B Explain how AI enables faster, more accurate detection", "quiz": [{"q": "A company's AI tool reviews a proposed firewall ruleset and recommends closing three unused ports. Per the framework, what should happen next?", "opts": ["The rules should be deployed immediately since AI recommendations are optimized for security", "A knowledgeable security technician should review the recommendation before it's implemented", "The rules should be ignored since AI cannot be trusted with security configuration", "The company should skip human review only if the AI reports high confidence"], "correct": 1, "explain": "The framework is explicit: AI-generated security recommendations should always be checked by a knowledgeable human before implementation, regardless of the AI's confidence level."}, {"q": "What is the primary reason AI-powered tools improve threat detection compared to manual review alone?", "opts": ["AI tools are immune to being fooled by adversaries", "AI tools can quickly sort a huge volume of digital events into likely-malicious vs. harmless, faster than humans can review manually", "AI eliminates the need for any human involvement in incident response", "AI tools only need to be trained once and never require updates"], "correct": 1, "explain": "The core rationale in the framework is speed and scale \u2014 humans can't manually examine millions of daily events, but AI can be trained to triage them quickly (EK 1.5.B.1\u2013B.2)."}, {"q": "An AI-powered detection tool is configured so that when it detects likely malicious activity, it can either alert a human analyst or take a specific pre-programmed corrective action automatically. This capability is described by which essential knowledge point?", "opts": ["1.5.A.1 \u2014 reviewing firewall configurations", "1.5.B.3 \u2014 AI tools can alert humans or take corrective action based on detected activity type", "1.4.B.2 \u2014 MFA as a defense against voice cloning", "1.3.C.3 \u2014 VPN usage on public networks"], "correct": 1, "explain": "This dual behavior \u2014 alert a human, or act automatically depending on the detected activity \u2014 is exactly what EK 1.5.B.3 describes."}], "html": "\n    <div class=\"section-label\">Core content</div>\n\n    <div class=\"card\">\n      <h3>Three places defenders apply AI <span class=\"ekid\">1.5.A.1\u2013A.3</span></h3>\n      <ul>\n        <li><b>Security configuration review (1.5.A.1)</b> \u2014 AI can review current settings like firewall rules and access controls and recommend more secure options. <b>Must always be checked by a knowledgeable security technician before implementation.</b></li>\n        <li><b>Application code review (1.5.A.2)</b> \u2014 AI-powered tools can analyze application code, identify vulnerabilities, and recommend mitigations. <b>Must always be reviewed by a knowledgeable programmer before implementation.</b></li>\n        <li><b>Detection rule generation (1.5.A.3)</b> \u2014 AI can suggest rules for automated detection systems. <b>Must always be reviewed by a knowledgeable detection engineer before being added to a system.</b></li>\n      </ul>\n      <div class=\"callout\"><b>This is the single most-repeated pattern in Topic 1.5:</b> every AI capability listed comes with an identical caveat \u2014 a qualified human must review the recommendation before it goes live. If an exam question describes an AI recommendation being deployed <i>without</i> human review, that is the flaw the question wants you to catch.</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>AI-assisted defense workflow</h3>\n      <p>AI-assisted defense can be understood as a sequence:</p>\n      <div class=\"example walkthrough\"><b>Collect events</b> \u2192 <b>Analyze events</b> \u2192 <b>Identify suspicious activity</b> \u2192 <b>Alert humans or take a specific corrective action</b> \u2192 <b>Human review when required</b></div>\n      <p><b>Detection</b> means identifying likely malicious activity. <b>Response</b> means taking action to contain, stop, or remediate it. AI can assist with both, but the framework specifically requires knowledgeable human review before AI-generated security configurations, application-code changes, or detection rules are implemented.</p>\n    </div>\n\n    <div class=\"card\">\n      <h3>Why scale and speed matter</h3>\n      <p>Networks can generate <b>millions of digital events each day</b>. A human analyst cannot manually inspect every event in detail. AI can rapidly analyze and triage large volumes of events, separating likely-malicious activity from harmless activity so human personnel can focus attention where it is needed most.</p>\n      <p>The key advantage is therefore <b>scale and speed</b>, not the assumption that AI is always more intelligent or more reliable than a human.</p>\n    </div>\n\n    <div class=\"card\">\n      <h3>Why human review remains necessary</h3>\n      <p>AI recommendations can be incorrect, lack context, or create unintended consequences. A technically reasonable configuration change could block legitimate users; a code recommendation could introduce a new problem; and an overly broad detection rule could generate excessive false alerts.</p>\n      <p>For Unit 1, remember the required pattern: <b>AI assists \u2192 qualified human reviews \u2192 recommendation is implemented if appropriate.</b></p>\n    </div>\n\n    <div class=\"card\">\n      <h3>Why AI improves detection speed and accuracy <span class=\"ekid\">1.5.B.1\u2013B.4</span></h3>\n      <ul>\n        <li><b>Scale problem (1.5.B.1)</b> \u2014 networks generate millions of digital events daily; some represent malicious activity, but humans cannot manually examine that volume of events.</li>\n        <li><b>Triage capability (1.5.B.2)</b> \u2014 AI tools can be trained to quickly analyze digital events and sort likely-malicious activity from harmless activity.</li>\n        <li><b>Automated response (1.5.B.3)</b> \u2014 AI tools can be programmed either to alert human personnel when likely malicious activity is detected, or to take specific corrective action automatically based on the type of activity detected.</li>\n        <li><b>Net effect (1.5.B.4)</b> \u2014 this enables threat-detection and response teams to catch malicious activity and intervene quickly, preventing loss, harm, damage, and destruction to digital infrastructure and data.</li>\n      </ul>\n    </div>\n\n    <div class=\"section-label\">Must-know terms</div>\n    <div class=\"card\">\n      <div class=\"glossary\">\n        <div class=\"gterm\"><b>Human-in-the-loop review \u2014</b> <span class=\"def\">the principle (tested repeatedly here) that AI-generated security recommendations require sign-off from a qualified human before implementation.</span></div>\n        <div class=\"gterm\"><b>Triage (in detection context) \u2014</b> <span class=\"def\">quickly sorting a large volume of events into likely-malicious vs. likely-harmless so humans can focus attention where it matters.</span></div>\n      </div>\n    </div>\n\n    <div class=\"example walkthrough\">\n      <b class=\"step\">Worked example (matches Scenario 1E \u2014 AI-Powered Cyber Defense):</b><br><br>\n      Before launching a new web app, a company asks an AI tool to review the code. The AI flags several places where user input is fed directly into database requests \u2014 a vulnerability that could let an adversary view or modify the warehouse database. The AI recommends input validation/sanitization fixes. The development team reviews and implements the recommended changes, then pushes to a testing environment before deployment.<br><br>\n      <b>Why this is the model example of \"doing it right\":</b> the AI did the heavy lifting of finding the vulnerability at scale, but a human team reviewed the changes before they went live \u2014 exactly the pattern described in EK 1.5.A.2.<br><br>\n      <b>Discussion point the scenario raises:</b> advantages of AI code review (speed, scale, catching what a rushed human review might miss) vs. disadvantages (AI can be wrong, can miss context, still needs a human check) \u2014 this is a good template for \"advantages and disadvantages\" free-response prompts.\n    </div>\n  ", "glossary": []}]}, {"id": 2, "slug": "securing-spaces", "title": "Unit 2 \u2014 Securing Spaces", "meta": "~21 class periods \u00b7 Skills emphasized: Analyze Risk \u00b7 Mitigate Risk \u00b7 Detect Attacks", "topics": [{"id": "2.1", "title": "Cyber Foundations", "lo": "2.1.A\u2013G", "quiz": [], "html": "<div class='callout'><b>Core idea:</b> This topic gives you the vocabulary and risk-management framework reused throughout the course.</div><div class='section-label'>Social engineering</div><div class='card'><h3>Eight tactics</h3><table><tr><th>Tactic</th><th>Definition</th></tr><tr><td class='label'>Pretexting</td><td>Creates a believable reason to contact a target.</td></tr><tr><td class='label'>Authority</td><td>Impersonates someone with power over the target or relays their supposed instructions.</td></tr><tr><td class='label'>Intimidation</td><td>States negative consequences if demands are not met.</td></tr><tr><td class='label'>Consensus</td><td>Creates social pressure by making the target believe everyone else is doing the desired action.</td></tr><tr><td class='label'>Scarcity</td><td>Creates a sense of limited availability.</td></tr><tr><td class='label'>Familiarity</td><td>Pretends to be or know someone close to the target to establish trust.</td></tr><tr><td class='label'>Urgency</td><td>Creates a deadline requiring quick action.</td></tr></table><div class='callout'><b>Trap:</b> pretexting is the believable cover story; authority is the claimed power or person. One attack may use both.</div></div><div class='section-label'>Adversaries</div><div class='card'><table><tr><th>Type</th><th>Defining feature</th><th>Motivation</th></tr><tr><td class='label'>Script kiddie</td><td>Low-skilled; uses others' tools without understanding them.</td><td>Greed/recognition</td></tr><tr><td class='label'>Hacktivist</td><td>Attacks to support a cause.</td><td>Social/political/personal cause</td></tr><tr><td class='label'>Insider</td><td>Already has legitimate credentials/access.</td><td>Greed/revenge</td></tr><tr><td class='label'>Cyberterrorist</td><td>Seeks disruption of communities, regions, or nations.</td><td>Politics/beliefs</td></tr><tr><td class='label'>Transnational criminal organization</td><td>Uses ransomware/IP theft for profit.</td><td>Financial gain</td></tr></table></div><div class='section-label'>Attack phases</div><div class='card'><ol><li><b>Reconnaissance</b> \u2014 gather target information, including OSINT.</li><li><b>Initial access</b> \u2014 establish a foothold.</li><li><b>Persistence</b> \u2014 maintain access for later use.</li><li><b>Lateral movement</b> \u2014 reach other systems/accounts/resources.</li><li><b>Taking action</b> \u2014 accomplish the objective.</li><li><b>Evading detection</b> \u2014 remove or alter evidence.</li></ol><div class='callout'><b>Sequence:</b> lateral movement is movement through resources; taking action is accomplishing the objective. Not every attack uses every phase.</div></div><div class='section-label'>Risk assessment</div><div class='card'><p><b>Risk</b> occurs when a threat can exploit a vulnerability to compromise an <b>asset</b>. Assess <b>likelihood</b> and <b>severity/impact</b>.</p><ul><li>Likelihood is influenced by target value, exploit difficulty, and adversary motivation/capability.</li><li><b>Quantitative</b> risk uses numbers or dollar values.</li><li><b>Qualitative</b> risk uses categories such as low/medium/high.</li><li>Documentation should identify assets, threats, vulnerabilities, exploitation method, likelihood, severity, and final rating.</li></ul></div><div class='section-label'>Risk management</div><div class='card'><table><tr><th>Strategy</th><th>Meaning</th></tr><tr><td class='label'>Avoid</td><td>Stop the activity generating the risk.</td></tr><tr><td class='label'>Transfer</td><td>Place the burden on another entity, such as an insurer.</td></tr><tr><td class='label'>Mitigate</td><td>Use controls to reduce likelihood or impact.</td></tr><tr><td class='label'>Accept</td><td>Tolerate the remaining risk.</td></tr></table><p><b>Residual risk</b> is the risk remaining after risk-reduction measures. Absolute security is unattainable.</p></div><div class='section-label'>Controls</div><div class='card'><h3>CIA triad</h3><p><b>Confidentiality</b> limits access to authorized parties. <b>Integrity</b> keeps data accurate and trustworthy. <b>Availability</b> keeps data/services accessible when needed.</p><h3>Control type vs. function</h3><table><tr><th>By type</th><td><b>Physical:</b> locks, fences, cameras, guards. <b>Technical:</b> firewalls, anti-malware, encryption. <b>Managerial:</b> policies, procedures, access reviews, IRPs.</td></tr><tr><th>By function</th><td><b>Preventative:</b> stops attacks. <b>Detective:</b> identifies attacks. <b>Corrective:</b> fixes/restores.</td></tr></table><div class='callout'><b>Example:</b> a camera is physical by type and detective by function.</div></div><div class='section-label'>Defense-in-depth</div><div class='card'><p>A layered strategy uses multiple security controls. Different layers address different threats, and resilience means another layer can still prevent access or limit damage when one control is bypassed.</p><p>Layers include <b>human, physical, network, device, application, and data</b>.</p></div>", "glossary": []}, {"id": "2.2", "title": "Physical Vulnerabilities and Attacks", "lo": "2.2.A\u2013C", "quiz": [], "html": "<div class='section-label'>Physical attacks</div><div class='card'><table><tr><th>Attack</th><th>Definition</th><th>Recognition cue</th></tr><tr><td class='label'>Piggybacking</td><td>Socially manipulates an authorized person into granting access.</td><td>Authorized person knows they are admitting someone, but is deceived.</td></tr><tr><td class='label'>Tailgating</td><td>Follows close behind an authorized person without their awareness.</td><td>Authorized person does not know the attacker followed them.</td></tr><tr><td class='label'>Shoulder surfing</td><td>Watches a user access sensitive information; may record it.</td><td>Observation of screens/keystrokes.</td></tr><tr><td class='label'>Dumpster diving</td><td>Searches physical trash for useful information.</td><td>Discarded documents/materials.</td></tr><tr><td class='label'>Card cloning</td><td>Copies an authorized user's access card.</td><td>Duplicate badge/card.</td></tr></table><div class='callout'><b>Memorize:</b> piggybacking = authorized person's awareness; tailgating = no awareness.</div></div><div class='section-label'>Physical exploitation</div><div class='card'><p>Threats include <b>human adversaries and natural disasters</b>. Physical vulnerabilities can cause unauthorized access, service disruption, theft/destruction, or unauthorized modification.</p><table><tr><th>Access/vulnerability</th><th>Potential impact</th></tr><tr><td class='label'>Power access</td><td>Cut wiring, breakers, substations, or transformers can make devices/services unavailable.</td></tr><tr><td class='label'>Sensitive area access</td><td>Adversary can steal or copy sensitive information.</td></tr><tr><td class='label'>Device + ports</td><td>Keylogger or malware-bearing external drive can collect data or potentially provide control.</td></tr><tr><td class='label'>Physical destruction</td><td>Device, stored data, and its services can become unavailable.</td></tr></table></div><div class='section-label'>Risk ratings</div><div class='card'><p><span class='risk-badge high'>HIGH</span> Sensitive information/systems exposed without sufficiently restricted access.</p><p><span class='risk-badge mod'>MODERATE</span> A nonsensitive/noncritical asset is exposed but can provide a <b>foothold</b> to more valuable resources.</p><p><span class='risk-badge low'>LOW</span> Vulnerable asset is low-value and exploitation is unlikely.</p><div class='example'><b>Scenario:</b> unlocked customer-data server room = high; receptionist computer with exposed USB ports that connects internally = moderate; unsecured laptop with no sensitive data in a badge-access office = low.</div></div><div class='section-label'>Reasoning rule</div><div class='card'><div class='grid'><div><b>ASSET</b>What is valuable?</div><div><b>VULNERABILITY</b>What physical weakness exposes it?</div><div><b>THREAT</b>Who/what can exploit it?</div><div><b>IMPACT</b>What loss, damage, disruption, or destruction could result?</div></div></div>", "glossary": []}, {"id": "2.3", "title": "Protecting Physical Spaces", "lo": "2.3.A\u2013B", "quiz": [], "html": "<div class='section-label'>Managerial controls</div><div class='card'><h3>Employee security awareness training</h3><ul><li>Detect social engineering/phishing.</li><li>Do not badge other people into restricted areas.</li><li>Prevent device theft.</li></ul><h3>Workstation security policy</h3><ul><li>Lock unattended devices.</li><li>Clear sensitive documents: <b>clean desk policy</b>.</li><li>Use privacy screens/physical barriers against shoulder surfing.</li><li>Use surge protectors or <b>UPS</b>.</li></ul></div><div class='section-label'>Physical mitigation controls</div><div class='card'><table><tr><th>Vulnerability</th><th>Control</th><th>Purpose</th></tr><tr><td class='label'>Building approach</td><td>Fences, gates, bollards</td><td>Deter physical access.</td></tr><tr><td class='label'>Unlocked areas/devices</td><td>Locks</td><td>Prevent access/theft.</td></tr><tr><td class='label'>Unauthorized entry</td><td>Card readers</td><td>Deny unauthorized badges and record access.</td></tr><tr><td class='label'>Piggyback/tailgate</td><td>Vestibules/turnstiles</td><td>Prevent unauthorized people entering with authorized people.</td></tr><tr><td class='label'>Exposed USB</td><td>Disable USB ports</td><td>Prevent external drives loading malware.</td></tr><tr><td class='label'>Power outage</td><td>UPS</td><td>Backup power for a device.</td></tr><tr><td class='label'>Large-scale outage</td><td>Generator</td><td>Backup power for buildings/critical devices.</td></tr></table></div><div class='section-label'>Choosing a mitigation</div><div class='card'><p>The AP framework says to consider <b>how the adversary could exploit the vulnerability</b> and how to <b>prevent, detect, or correct</b> the attack. Then weigh risk severity against mitigation cost.</p><div class='grid'><div><b>1</b>Identify the vulnerability.</div><div><b>2</b>Identify the attack path.</div><div><b>3</b>Choose the control that interrupts that path.</div><div><b>4</b>Consider cost and residual risk.</div></div><div class='callout'><b>Bad:</b> \u201cInstall cameras because cameras are secure.\u201d <b>Good:</b> \u201cThe server room has sensitive data and uncontrolled access, so install a lock/card reader to restrict entry.\u201d</div></div>", "glossary": []}, {"id": "2.4", "title": "Detecting Physical Attacks", "lo": "2.4.A\u2013C", "quiz": [], "html": "<div class='section-label'>Detection methods</div><div class='card'><table><tr><th>Method</th><th>What it does</th></tr><tr><td class='label'>Cameras</td><td>Provide visual monitoring and recorded evidence; footage can support investigation.</td></tr><tr><td class='label'>Security guards</td><td>Monitor activity and respond to suspicious activity.</td></tr><tr><td class='label'>Motion sensors</td><td>Alert security to movement.</td></tr><tr><td class='label'>Employees</td><td>Can notice unauthorized people and alert security.</td></tr></table></div><div class='section-label'>Placement</div><div class='card'><ul><li><b>Cameras:</b> consider angle, visual coverage, tamper resistance, and entrances/exits.</li><li><b>Motion sensors:</b> best where traffic is unexpected, such as server rooms or sensitive storage.</li><li><b>Locks/vestibules:</b> at entries to sensitive areas.</li><li><b>Stationary guards:</b> fixed traffic-funneling points such as entrances/lobbies.</li><li><b>Patrolling guards:</b> perimeters/exterior areas because their movement is harder to predict.</li></ul><div class='callout'><b>Alert fatigue:</b> excessive false positives can make responders take alerts less seriously. More detection devices is not automatically better.</div></div><div class='section-label'>Applying detection</div><div class='card'><table><tr><th>Combination</th><th>Use</th></tr><tr><td class='label'>Motion + camera</td><td>Motion generates an alert; camera helps verify what caused it.</td></tr><tr><td class='label'>Camera + facial recognition</td><td>Can alert to unauthorized individuals in controlled areas.</td></tr><tr><td class='label'>Badge/door sensor + logs</td><td>Unusually long door-open duration can reveal possible piggybacking/tailgating.</td></tr><tr><td class='label'>Live + recorded footage</td><td>Live supports immediate monitoring; recording supports later reconstruction.</td></tr></table></div><div class='section-label'>Placement decision tree</div><div class='card'><div class='grid'><div><b>SERVER ROOM</b>Rare movement \u2192 motion sensor + camera.</div><div><b>MAIN ENTRANCE</b>Traffic funnel \u2192 stationary guard + badge/door logging.</div><div><b>EXTERIOR PERIMETER</b>Need unpredictability \u2192 patrolling guard.</div><div><b>BUSY LOBBY</b>High legitimate movement \u2192 avoid motion sensor as primary detector because of false alarms.</div></div></div><div class='example'><b>Key principle:</b> a detection control is effective only if its placement produces useful evidence. Ask what normal activity looks like, what abnormal activity looks like, and whether the control can distinguish them.</div>", "glossary": []}]}, {"id": 3, "slug": "securing-networks", "title": "Unit 3 \u2014 Securing Networks", "meta": "~26 class periods \u00b7 Skills emphasized: Analyze Risk \u00b7 Mitigate Risk \u00b7 Detect Attacks", "topics": [{"id": "3.1", "title": "Network Vulnerabilities and Attacks", "lo": "3.1.A Identify common network attacks &middot; 3.1.B Explain how adversaries exploit network vulnerabilities &middot; 3.1.C Assess and document risks from network vulnerabilities", "quiz": [{"q": "A network log shows the same IP address associated with two different MAC addresses within a short time window. This is most likely evidence of:", "opts": ["A smurf attack", "ARP poisoning", "DNS poisoning", "War driving"], "correct": 1, "explain": "A legitimate device's MAC address shouldn't change. Two MAC addresses claiming the same IP is the classic ARP poisoning signature, used to redirect traffic to the adversary via a falsified ARP table entry."}, {"q": "An adversary sends many ICMP requests using a victim's IP address as the source, directed at a network's broadcast address, causing every device on that network to flood the victim with replies. This is an example of a:", "opts": ["MAC flooding attack", "Smurf attack", "Rogue access point attack", "Credential harvesting attack"], "correct": 1, "explain": "This is the exact mechanism of a smurf attack \u2014 spoofing the victim's address in ICMP requests sent to a broadcast address so the entire network unwittingly floods the real victim."}, {"q": "An organization's external firewall is not configured to block external ICMP traffic, but no other significant weaknesses were found. How should this vulnerability most likely be rated?", "opts": ["High risk", "Moderate risk", "Low risk", "This is not a risk at all"], "correct": 1, "explain": "This matches the framework's own illustrative example of a moderate risk \u2014 it could give an adversary information-gathering ability, but doesn't by itself allow major impact like data capture or device spoofing."}, {"q": "An adversary plugs a wireless access point into an open, unused network port in a conference room, then accesses the internal network wirelessly from the parking lot. Which vulnerability did this exploit?", "opts": ["A properly configured firewall", "Lack of port security enabling a rogue access point", "A DNS poisoning vulnerability", "A patched zero-day"], "correct": 1, "explain": "An open port without port security lets an adversary create a rogue access point that grants direct wireless LAN access, bypassing any firewalls entirely \u2014 exactly the scenario described."}], "html": "\n    <div class=\"section-label\">Core content</div>\n\n    <div class=\"card\">\n      <h3>ARP poisoning / on-path (man-in-the-middle) attack <span class=\"ekid\">3.1.A.1</span></h3>\n      <p>The <b>address resolution protocol (ARP)</b> is used by a default gateway to build a table pairing IP addresses with MAC addresses. In an <b>ARP poisoning attack</b>, an adversary sends falsified ARP packets to the gateway to modify that table so the adversary's device receives traffic meant for the victim, by linking the victim's IP to the adversary's MAC address (this is <b>MAC spoofing</b> \u2014 faking a MAC address).</p>\n      <p>This is a specific example of an <b>on-path attack</b> (also called a man-in-the-middle attack): the adversary interrupts a data stream between two parties, captures both parties' data, and can copy or alter it before forwarding it on. Both original parties believe they're communicating directly with each other.</p>\n    </div>\n\n    <div class=\"card\">\n      <h3>MAC flooding <span class=\"ekid\">3.1.A.2</span></h3>\n      <p>An adversary sends a target switch many Ethernet frames, each with a different (often spoofed) MAC address. This can force the switch into <b>broadcast mode</b>, letting the adversary collect all frames on the network since they're now being broadcast rather than switched \u2014 potentially exposing sensitive info. This is an example of <b>eavesdropping (sniffing)</b> \u2014 capturing data in transit to record and copy it.</p>\n    </div>\n\n    <div class=\"card\">\n      <h3>DNS poisoning <span class=\"ekid\">3.1.A.3</span></h3>\n      <p>An adversary pretends to be an authoritative name server (NS) and plants a fake DNS record on a DNS server to redirect browser traffic to a malicious site designed to steal credentials. This is an example of <b>credential harvesting</b> \u2014 a fake login site that looks real, capturing whatever credentials unsuspecting users enter.</p>\n    </div>\n\n    <div class=\"card\">\n      <h3>Smurf attack (a DoS/DDoS type) <span class=\"ekid\">3.1.A.4</span></h3>\n      <p>A <b>smurf attack</b> attempts to overwhelm a network with ICMP requests \u2014 it's a type of <b>denial of service (DoS)</b> attack, which makes a system/resource unavailable to authorized users. The adversary sends many ICMP requests carrying the <i>victim's</i> address as the source, directed at the network's broadcast address. The gateway relays these to every device on the network; each device replies to the victim's address, flooding the victim with traffic that can block legitimate messages. When multiple devi
